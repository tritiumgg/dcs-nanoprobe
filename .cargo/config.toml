[alias]
# Development and test tooling, built from source and never released.
xtask = "run --quiet -p xtask --"

# The agent DLL links the C runtime statically, so it needs no VC++
# redistributable beside DCS and brings its own runtime into the process
# (plan decision; E27 checks it loads under Wine).
[target.x86_64-pc-windows-msvc]
# Microsoft ships the static CRT without its PDBs, so lld-link warns once per
# object (LNK4099). The agent's own PDB is complete without them.
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/IGNORE:4099"]
