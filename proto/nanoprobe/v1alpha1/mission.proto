// The mission DCS runs: weather and time for the next load, reload, status.
syntax = "proto3";

package nanoprobe.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "nanoprobe/v1alpha1/common.proto";
import "nanoprobe/v1alpha1/events.proto";
import "nanoprobe/v1alpha1/session.proto";

option java_multiple_files = true;
option java_package = "nanoprobe.v1alpha1";

service MissionService {
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
  // Date, time, weather, briefing and briefing images written into the
  // shell at the next load.
  rpc SetNextMission(SetNextMissionRequest) returns (SetNextMissionResponse);
  // Write the shell and load it. The campaign is restored after the load.
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  // Copy an image or sound file into the campaign, or remove one. Every
  // shell the campaign writes from then on carries it.
  rpc SetMissionFile(SetMissionFileRequest) returns (SetMissionFileResponse);
  // The files the campaign carries into its shells.
  rpc ListMissionFiles(ListMissionFilesRequest) returns (ListMissionFilesResponse);
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_HUNG = 2;
  HEALTH_GONE = 3;
  HEALTH_DISABLED = 4;
}

// Achieved period of each sampling tier, so a controller sees how stale its
// view is.
message SampleRates {
  google.protobuf.Duration position = 1;
  google.protobuf.Duration vitals = 2;
  google.protobuf.Duration warehouse = 4;
  google.protobuf.Duration enumeration = 5;
  reserved 3;
  reserved "ammo";
}

message ServerStatus {
  Health health = 1;
  // Time since the agent's last heartbeat.
  google.protobuf.Duration heartbeat_age = 2;
  SimState sim_state = 3;
  string theater = 4;
  Stamp now = 5;
  // The active campaign, 0 for none.
  uint64 campaign_id = 6;
  SampleRates achieved = 7;
  // Agent overhead as a share of real time over the last minute.
  double overhead_share = 8;
  // Commands waiting to be applied.
  uint32 commands_queued = 9;
  // Commands over the commanded-work budget since DCS started.
  uint64 commands_over_budget = 10;
  uint64 samples_dropped = 11;
  uint64 event_gaps = 12;
  string agent_build = 13;
  string dcs_version = 14;
  // Whether the sidecar is attached to the agent. Not part of health: a DCS
  // whose heartbeat advances is healthy even when the sidecar cannot attach.
  bool attached = 15;
  // The reason of the last refused handshake, empty for none.
  string attach_error = 16;
  // The agent DLL's interface version from its last HELLO, 0 before one: the
  // ABI between the DLL and its Lua hook and shim. Reported, not checked.
  uint32 agent_interface = 17;
  // Free bytes on the store's file system; unset with the store off.
  optional uint64 store_free_bytes = 18;
  // Free space is below the active store, its WAL and its events file:
  // backups are refused. Not part of health.
  bool store_space_low = 19;
  // How big the active campaign's store is; unset with no active campaign.
  StoreSize store_size = 20;
  // When the last scheduled backup that succeeded was taken, since the
  // sidecar started; unset for none.
  google.protobuf.Timestamp last_backup = 21;
  // When the last scheduled backup that failed, or was skipped for low free
  // space, was due, since the sidecar started; unset for none. A failed
  // backup is taken again at the next interval. Not part of health: a
  // watchdog must not restart DCS for it.
  google.protobuf.Timestamp last_backup_failure = 22;
  // Why that backup failed or was skipped, naming the store, with SQLite's
  // extended result code when SQLite failed; empty for none.
  string backup_error = 23;
  // The DCS IDs left in the DCS process now running, for marks and drawings
  // of every campaign together: the pool is 2^30 to 2^31-1, each add takes
  // one, and none is given back until DCS restarts. A put that adds more than
  // are left is RESOURCE_EXHAUSTED (DCS_IDS_FULL) with nothing written; items
  // already shown stay and every other call works.
  uint64 dcs_ids_left = 24;
  // The pool is low: dcs_ids_left is under 1% of the pool (about 10.7
  // million IDs). Not part of health: restarting DCS is the owner's call.
  bool dcs_ids_low = 25;
}

// What the active campaign's store holds and how fast it is bounded
// (spec/persistence.md, "Size"). The counters count since the campaign's
// store was opened: its activation, or the sidecar's start with it active;
// with the store off, since the campaign was made.
message StoreSize {
  // Groups and statics held that are neither dead nor removed.
  uint64 groups_live = 1;
  // Dead groups, not statics, not removed: they expire after `dead_keep_h`.
  uint64 groups_dead = 2;
  // Dead statics, not removed.
  uint64 ruins = 3;
  // Removed groups and statics whose rows are still kept.
  uint64 awaiting_purge = 4;
  // Unit rows held.
  uint64 units = 5;
  // The removal time of the oldest entity awaiting purge; unset for none.
  google.protobuf.Timestamp oldest_removal = 6;
  // Journal rows held.
  uint64 journal_rows = 7;
  // The time of the oldest journal entry; unset for none.
  google.protobuf.Timestamp oldest_journal_entry = 8;
  // Event rows held.
  uint64 event_rows = 9;
  // The time of the oldest event; unset for none.
  google.protobuf.Timestamp oldest_event = 10;
  // Size of store.sqlite and its WAL; 0 with the store off.
  uint64 store_file_bytes = 11;
  // Size of events.sqlite and its WAL; 0 with the store off.
  uint64 events_file_bytes = 12;
  // Removed entities purged.
  uint64 purged = 13;
  // Dead groups expired.
  uint64 expired = 14;
  // Late deaths dropped because their unit was purged.
  uint64 purged_deaths = 15;
  // Drift destroys sent for objects named for entities the store does not
  // hold.
  uint64 orphan_destroys = 16;
  // The groups in the reconciler's work set: those the plan has something to
  // do for. The plan also visits every group with an object bound.
  uint64 work_set = 17;
  // The bytes of the journal's entries kept, as journal_max_mb counts them.
  uint64 journal_bytes = 18;
  // The bytes of the events kept, as events_max_mb counts them.
  uint64 event_bytes = 19;
}

message GetServerStatusRequest {}

message GetServerStatusResponse {
  ServerStatus status = 1;
}

message NextMission {
  // The theater to load. Empty keeps the loaded one.
  string theater = 1;
  // The mission's date and start time, the mission's own calendar time in
  // a Timestamp with no time-zone conversion. Absent carries the campaign
  // clock. Used by the next shell written for this theater (any theater
  // when `theater` is empty); the commit that owes that load clears it.
  google.protobuf.Timestamp start = 2;
  // The whole DCS weather table, in place of the template's. Absent keeps
  // the template's. It must hold `clouds` and `season` tables. Setting it
  // together with `conditions` is INVALID_FIELD.
  google.protobuf.Struct weather = 3 [deprecated = true];
  // Dynamic-spawn flags of airports, by their key in the template's
  // `warehouses.airports` (that it equals DCS `Airbase:getID()` is
  // UNVERIFIED). Airports not named keep the template's flags. An ID the
  // template does not hold is INVALID_FIELD.
  repeated DynamicSpawn dynamic_spawn = 4;
  // The weather, typed. Each field left unset keeps the template's value;
  // the checks run on the template's weather with these fields set. Any
  // field set makes the weather static (`atmosphere_type` 0) and turns the
  // template's legacy fog off.
  Weather conditions = 5;
  // The briefing text. Each field left unset keeps the template's text.
  Briefing briefing = 6;
  // The briefing images. A list left unset keeps the template's.
  BriefingImages briefing_images = 7;
}

// A mission's weather, in the Mission Editor's terms and ranges.
message Weather {
  // Degrees Celsius at sea level, -50 to 50. The sim keeps the temperature
  // within the map's range for the mission's date: -5 on a June date ran at
  // 8 at the ground (LIVE).
  optional double temperature_c = 1;
  // QNH in millimeters of mercury, 720 to 790.
  optional double qnh_mmhg = 2;
  // Meters, 0 to 80000. That a client sees it is UNVERIFIED.
  optional double visibility_m = 3;
  // The wind at the ground, at 2000 m and at 8000 m.
  Wind wind_ground = 4;
  Wind wind_2000m = 5;
  Wind wind_8000m = 6;
  // Meters per second, 0 to 6, in steps of 0.1.
  optional double ground_turbulence_mps = 7;
  Clouds clouds = 8;
  Fog fog = 9;
  Dust dust = 10;
  Halo halo = 11;
}

message Wind {
  // Meters per second, 0 to 50.
  double speed_mps = 1;
  // The direction the wind blows toward, degrees clockwise from north, 0 to
  // 359: DCS's `dir` (LIVE: the sim's wind vector points this way).
  uint32 toward_deg = 2;
}

message Clouds {
  // UNSPECIFIED keeps the template's preset; NONE removes it.
  CloudPreset preset = 1;
  // The cloud base in meters: 300 to 5000 with no preset, or within the
  // preset's range (spec/persistence.md, "Weather").
  optional double base_m = 2;
  // Meters, 200 to 2000. Only with no preset.
  optional double thickness_m = 3;
  // 0 to 10. Only with no preset.
  optional uint32 density = 4;
  // Only with no preset. Rain and thunderstorm need a temperature of 0 or
  // more, snow and snowstorm 0 or less; rain and snow need a density of 5 or
  // more, thunderstorm and snowstorm 9 or more.
  Precipitation precipitation = 5;
}

// The Mission Editor's cloud presets, as DCS names them.
enum CloudPreset {
  CLOUD_PRESET_UNSPECIFIED = 0;
  CLOUD_PRESET_NONE = 1;
  CLOUD_PRESET_1 = 2;
  CLOUD_PRESET_2 = 3;
  CLOUD_PRESET_3 = 4;
  CLOUD_PRESET_4 = 5;
  CLOUD_PRESET_5 = 6;
  CLOUD_PRESET_6 = 7;
  CLOUD_PRESET_7 = 8;
  CLOUD_PRESET_8 = 9;
  CLOUD_PRESET_9 = 10;
  CLOUD_PRESET_10 = 11;
  CLOUD_PRESET_11 = 12;
  CLOUD_PRESET_12 = 13;
  CLOUD_PRESET_13 = 14;
  CLOUD_PRESET_14 = 15;
  CLOUD_PRESET_15 = 16;
  CLOUD_PRESET_16 = 17;
  CLOUD_PRESET_17 = 18;
  CLOUD_PRESET_18 = 19;
  CLOUD_PRESET_19 = 20;
  CLOUD_PRESET_20 = 21;
  CLOUD_PRESET_21 = 22;
  CLOUD_PRESET_22 = 23;
  CLOUD_PRESET_23 = 24;
  CLOUD_PRESET_24 = 25;
  CLOUD_PRESET_25 = 26;
  CLOUD_PRESET_26 = 27;
  CLOUD_PRESET_27 = 28;
  CLOUD_PRESET_RAINY_1 = 29;
  CLOUD_PRESET_RAINY_2 = 30;
  CLOUD_PRESET_RAINY_3 = 31;
  CLOUD_PRESET_RAINY_4 = 32;
  CLOUD_PRESET_RAINY_5 = 33;
  CLOUD_PRESET_RAINY_6 = 34;
  // DCS `NEWRAINPRESET4`.
  CLOUD_PRESET_NEW_RAINY_4 = 35;
}

enum Precipitation {
  PRECIPITATION_UNSPECIFIED = 0;
  PRECIPITATION_NONE = 1;
  PRECIPITATION_RAIN = 2;
  PRECIPITATION_THUNDERSTORM = 3;
  PRECIPITATION_SNOW = 4;
  PRECIPITATION_SNOWSTORM = 5;
}

// Fog that is not off cannot be set together with dust.
message Fog {
  // UNSPECIFIED keeps the template's fog.
  FogMode mode = 1;
  // MANUAL only, and then required: 1 to 16 keys, times strictly increasing.
  repeated FogKey manual = 2;
}

enum FogMode {
  FOG_MODE_UNSPECIFIED = 0;
  FOG_MODE_OFF = 1;
  FOG_MODE_AUTO = 2;
  FOG_MODE_MANUAL = 3;
}

message FogKey {
  // Required. The time of day, a whole number of seconds from 0 to 24 hours.
  google.protobuf.Duration time_of_day = 1;
  // Meters, 0 to 100000.
  double visibility_m = 2;
  // Meters, 0 to 5000.
  double thickness_m = 3;
}

// Dust cannot be enabled together with fog that is not off.
message Dust {
  bool enabled = 1;
  // The visibility in the dust in meters, 300 to 20000. Only when enabled.
  double visibility_m = 2;
}

message Halo {
  // UNSPECIFIED keeps the template's.
  HaloPreset preset = 1;
  // UNSPECIFIED keeps the template's. Only with a preset other than OFF.
  HaloCrystals crystals = 2;
}

enum HaloPreset {
  HALO_PRESET_UNSPECIFIED = 0;
  HALO_PRESET_OFF = 1;
  HALO_PRESET_AUTO = 2;
  HALO_PRESET_ATMO_HIGH_CLOUDS = 3;
  HALO_PRESET_CIRRUS_ONLY = 4;
  HALO_PRESET_HIGH_CLOUDS = 5;
  HALO_PRESET_VOLUMETRIC_ONLY = 6;
}

enum HaloCrystals {
  HALO_CRYSTALS_UNSPECIFIED = 0;
  HALO_CRYSTALS_ALL_KINDS = 1;
  HALO_CRYSTALS_BASIC_HALO_CIRCLE = 2;
  HALO_CRYSTALS_BASIC_HALO_WITH_SUNDOGS = 3;
  HALO_CRYSTALS_BASIC_SUNDOGS_TANGENTS = 4;
  HALO_CRYSTALS_SUNDOGS_ARCS = 5;
  HALO_CRYSTALS_TANGENTS = 6;
}

// Briefing text, each at most 65536 bytes of UTF-8 with no NUL. An empty
// string makes the text empty.
message Briefing {
  // The sortie: the mission's name on the briefing screen.
  optional string sortie = 1;
  // The situation, the briefing's main text.
  optional string description = 2;
  optional string blue_task = 3;
  optional string red_task = 4;
  optional string neutral_task = 5;
}

message BriefingImages {
  ImageList blue = 1;
  ImageList red = 2;
  ImageList neutral = 3;
  // The images of the coalition selection screen, which a client sees
  // before it picks a coalition.
  ImageList coalition_selection = 4;
}

// Images in the order the briefing shows them, 0 to 16. Each is the name of
// an image the campaign holds (SetMissionFile, kind MISSION) or of one in
// the template's `l10n/DEFAULT/`. An empty list removes the coalition's
// images.
message ImageList {
  repeated string files = 1;
}

enum MissionFileKind {
  MISSION_FILE_KIND_UNSPECIFIED = 0;
  // In the mission's resources (`l10n/DEFAULT/`): briefing images, and
  // files PlaySound, Picture, a broadcast and the template's triggers use.
  MISSION_FILE_KIND_MISSION = 1;
  // A kneeboard page for every aircraft (`KNEEBOARD/IMAGES/`). An image.
  // Shown in a UH-1H cockpit (LIVE).
  MISSION_FILE_KIND_KNEEBOARD = 2;
  // A kneeboard page for one aircraft type (`KNEEBOARD/<type>/IMAGES/`).
  // An image. Shown in a UH-1H cockpit for type `UH-1H` (LIVE).
  MISSION_FILE_KIND_KNEEBOARD_TYPE = 3;
}

// A file the campaign carries into its shells.
message MissionFile {
  // The file's name in the mission.
  string name = 1;
  MissionFileKind kind = 2;
  // KNEEBOARD_TYPE only: the aircraft type.
  string aircraft_type = 5;
  uint64 size_bytes = 3;
  // SHA-256 of the file's bytes.
  bytes sha256 = 4;
}

message SetMissionFileRequest {
  Write write = 1;
  // The file's name in the mission: 1 to 64 characters of `A`-`Z`, `a`-`z`,
  // `0`-`9`, `_`, `-` and `.`, ending in `.png`, `.jpg`, `.jpeg`, `.ogg` or
  // `.wav`. No two paths in the mission differ only in case: not two
  // aircraft types' folders, nor two names in one folder, among the
  // campaign's files and its templates' files. A name the
  // template already holds is replaced, and must then be the template's name
  // exactly, with the same media type; such a name may be longer or use
  // other characters, but holds no `/`, `\`, `..` or NUL.
  string name = 2;
  MissionFileKind kind = 3;
  // KNEEBOARD_TYPE only, and then required: the aircraft type as DCS names
  // it, such as `UH-1H`, 1 to 64 characters of `A`-`Z`, `a`-`z`, `0`-`9`,
  // `_`, `-` and `.`. A file is known by its kind, type and name together.
  string aircraft_type = 5;
  // The file as the sidecar opens it: an absolute path that resolves,
  // after symbolic links and `..`, to a file inside a folder that
  // [missions] template_dirs lists (spec/config.md). At most 8 MiB, a PNG,
  // JPEG, Ogg Vorbis or PCM WAV file whose contents match its name's type.
  // Empty removes the campaign's file.
  string path = 4;
}

message SetMissionFileResponse {
  // The file set; absent after a removal.
  MissionFile file = 1;
}

message ListMissionFilesRequest {
  // 0 for the active campaign.
  uint64 campaign_id = 1;
}

message ListMissionFilesResponse {
  // By kind, aircraft type, then name.
  repeated MissionFile files = 1;
}

message DynamicSpawn {
  uint64 airbase_id = 1;
  // `dynamicSpawn`: players may spawn aircraft from the airport's stock.
  // True also makes the airport's aircraft limited (`unlimitedAircrafts`
  // false), so dynamic spawn offers the aircraft stock the controller sets
  // (SetWarehouseStock). The owner SetAirbaseOwner sets decides the
  // coalition it offers them to (spec/persistence.md: LIVE that
  // getAirdromesCoalition gives that owner). AI the
  // mission spawns there use the same stock.
  bool enabled = 2;
  // `allowHotStart`.
  bool hot_start = 3;
}

message SetNextMissionRequest {
  Write write = 1;
  NextMission next = 2;
}

message SetNextMissionResponse {}

message ReloadRequest {
  Write write = 1;
}

message ReloadResponse {
  CommandResult result = 1;
}
