// Players and what they see: messages, marks, drawings, menus, chat.
syntax = "proto3";

package nanoprobe.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "nanoprobe/v1alpha1/common.proto";
import "nanoprobe/v1alpha1/session.proto";
import "nanoprobe/v1alpha1/world.proto";

option java_multiple_files = true;
option java_package = "nanoprobe.v1alpha1";

// Menu selections and chat arrive as events (EventsService).
service PlayersService {
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  // Who was in which unit, and when.
  rpc ListOccupancy(ListOccupancyRequest) returns (ListOccupancyResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc PlaySound(PlaySoundRequest) returns (PlaySoundResponse);
  rpc SendChat(SendChatRequest) returns (SendChatResponse);
  rpc PutMark(PutMarkRequest) returns (PutMarkResponse);
  rpc PutDrawing(PutDrawingRequest) returns (PutDrawingResponse);
  rpc PutMenuItem(PutMenuItemRequest) returns (PutMenuItemResponse);
  // Create or change a markup group of marks and drawings.
  rpc PutMarkupGroup(PutMarkupGroupRequest) returns (PutMarkupGroupResponse);
  // Remove a markup group and every item in it.
  rpc RemoveMarkupGroup(RemoveMarkupGroupRequest) returns (RemoveMarkupGroupResponse);
  // Make a markup group hold exactly the items given, by label, in one write.
  rpc ReplaceMarkupGroup(ReplaceMarkupGroupRequest) returns (ReplaceMarkupGroupResponse);
  rpc ListMarkupGroups(ListMarkupGroupsRequest) returns (ListMarkupGroupsResponse);
  // Remove a mark the platform does not hold, such as a player's, by its DCS
  // ID. An effect.
  rpc RemovePlayerMark(RemovePlayerMarkRequest) returns (RemovePlayerMarkResponse);
  // Erase one player's records, or move them to a new key.
  rpc ErasePlayer(ErasePlayerRequest) returns (ErasePlayerResponse);
}

message Player {
  // Constant across sessions, names and campaigns.
  string key = 1;
  string name = 2;
  bool connected = 3;
  Coalition coalition = 4;
  // The unit the player is in, 0 for none.
  uint64 unit_id = 5;
  uint32 seat = 6;
  reserved 7;
  reserved "fuel_used";
  // The ammunition of the unit in `unit_id`, by weapon type name, as the last
  // birth or takeoff read gave it. It is the same loadout that `Unit.ammo`
  // shows for a unit the store holds, and it also covers an adopted unit,
  // which has no `Unit`. Empty when no read was made, when `unit_id` is 0 and
  // after the player leaves the unit. A new mission generation clears it
  // (spec/world.md, "Ammunition").
  map<string, uint32> ammo = 8;
  // The read that gave `ammo`. Absent when `ammo` has no read.
  AmmoRead ammo_read = 9;
}

message Occupancy {
  string player_key = 1;
  uint64 unit_id = 2;
  uint32 seat = 3;
  google.protobuf.Timestamp from = 4;
  // Absent while the player is still in the seat.
  google.protobuf.Timestamp to = 5;
}

message ListPlayersRequest {
  // Include players who are not connected.
  bool include_offline = 1;
}

message ListPlayersResponse {
  repeated Player players = 1;
}

message ListOccupancyRequest {
  // The campaign to read, 0 for the active one.
  uint64 campaign_id = 1;
  // Empty for every player.
  string player_key = 2;
  // 0 for every unit.
  uint64 unit_id = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
}

message ListOccupancyResponse {
  repeated Occupancy occupancy = 1;
}

message SendMessageRequest {
  Write write = 1;
  Audience audience = 2;
  string text = 3;
  double seconds = 4;
  // Clear earlier messages first.
  bool clear = 5;
}

message SendMessageResponse {
  CommandResult result = 1;
}

message PlaySoundRequest {
  Write write = 1;
  Audience audience = 2;
  // The sound file's name in the mission.
  string file = 3;
}

message PlaySoundResponse {
  CommandResult result = 1;
}

message SendChatRequest {
  Write write = 1;
  // Empty for everyone.
  string player_key = 2;
  string text = 3;
}

message SendChatResponse {
  CommandResult result = 1;
}

message PutMarkRequest {
  Write write = 1;
  // 0 creates a mark.
  uint64 mark_id = 2;
  // Everyone, one coalition or one group. A unit fails with INVALID_FIELD.
  Audience audience = 3;
  Position position = 4;
  string text = 5;
  bool read_only = 6;
  // With mark_id 0, a label a live mark holds changes that mark. Empty sets
  // no label. A label a drawing holds fails with ALREADY_EXISTS.
  string label = 7;
  // The markup group to draw it in, made with defaults if new. Empty for none.
  string markup_group = 8;
  // Model seconds from now until the mark is removed. Absent keeps the
  // mark's expiry, or for a new mark takes its markup group's.
  optional double expire_after_s = 9;
}

message PutMarkResponse {
  uint64 mark_id = 1;
  uint64 revision = 2;
}

message PutDrawingRequest {
  Write write = 1;
  // 0 creates a drawing.
  uint64 drawing_id = 2;
  // Everyone or one coalition.
  Audience audience = 3;
  // Deprecated: set typed_shape. A put sets typed_shape or this pair, not both
  // and not neither. The DCS markupToAll shape number: 1 line (two points), 3
  // polygon through 2 to 7,990 points (a line with two), 4 arrow (two points),
  // 5 text box (one point), 6 quad (four points), 7 freeform (3 to 7,990
  // points). Any other shape is INVALID_ARGUMENT: DCS can crash on one.
  uint32 shape = 4 [deprecated = true];
  // Deprecated: set typed_shape. The shape's arguments, as DCS takes them: the
  // points, each an object of finite x, y and z within 10,000 km of 0 (y is not
  // kept), then color and fill (each a list of four numbers from 0 to 1), the
  // line type (a whole
  // number from 0 to 6; for shape 5 the font size, a whole number from 1 to
  // 100), read only (a bool) and the message (a string). Any other layout is
  // INVALID_ARGUMENT. The drawing is stored as the DrawingShape it describes,
  // with an empty theater.
  google.protobuf.ListValue args = 5 [deprecated = true];
  // As in PutMarkRequest.
  string label = 6;
  string markup_group = 7;
  optional double expire_after_s = 8;
  // What it draws (spec/world.md, "Drawings").
  DrawingShape typed_shape = 9;
}

message PutDrawingResponse {
  uint64 drawing_id = 1;
  uint64 revision = 2;
}

message PutMenuItemRequest {
  Write write = 1;
  // 0 creates an item.
  uint64 item_id = 2;
  // The parent submenu, 0 for the root.
  uint64 parent_id = 3;
  // Everyone, one coalition or one group.
  Audience audience = 4;
  string text = 5;
  // A submenu holds items; a command returns a menu event when selected.
  bool submenu = 6;
}

message PutMenuItemResponse {
  uint64 item_id = 1;
  uint64 revision = 2;
}

message ErasePlayerRequest {
  Write write = 1;
  string player_key = 2;
  // Move the records to this key instead of erasing them. Empty erases.
  string new_key = 3;
  // Must be true.
  bool confirm = 4;
}

message ErasePlayerResponse {}

message PutMarkupGroupRequest {
  Write write = 1;
  // Every field is set as given.
  MarkupGroup markup_group = 2;
}

message PutMarkupGroupResponse {
  uint64 revision = 1;
}

message RemoveMarkupGroupRequest {
  Write write = 1;
  string name = 2;
}

message RemoveMarkupGroupResponse {
  uint64 revision = 1;
}

// A mark or drawing of a ReplaceMarkupGroup call.
message MarkupGroupItem {
  // Required, unique in the call.
  string label = 1;
  Audience audience = 2;
  optional double expire_after_s = 3;
  oneof kind {
    MarkupGroupMark mark = 4;
    MarkupGroupDrawing drawing = 5;
  }
}

message MarkupGroupMark {
  Position position = 1;
  string text = 2;
  bool read_only = 3;
}

message MarkupGroupDrawing {
  // Unused: setting either is INVALID_ARGUMENT. Set typed_shape.
  uint32 shape = 1 [deprecated = true];
  google.protobuf.ListValue args = 2 [deprecated = true];
  // What it draws, as in PutDrawingRequest. Required.
  DrawingShape typed_shape = 3;
}

message ReplaceMarkupGroupRequest {
  Write write = 1;
  // The markup group, made with defaults if new.
  string name = 2;
  repeated MarkupGroupItem items = 3;
}

message ReplaceMarkupGroupResponse {
  // Each item's entity, in the order given.
  repeated uint64 ids = 1;
  uint64 revision = 2;
}

message ListMarkupGroupsRequest {
  // The campaign to read, 0 for the active one.
  uint64 campaign_id = 1;
}

message ListMarkupGroupsResponse {
  repeated MarkupGroup markup_groups = 1;
  reserved 2, 3;
  reserved "mark_slots_left", "ungrouped_slots_left";
}

message RemovePlayerMarkRequest {
  Write write = 1;
  // The DCS mark ID, from a mark event's mark_id. An ID the platform issued in
  // the running DCS process (WorldEvent.platform_mark), held or retired, fails
  // with INVALID_ARGUMENT.
  uint64 mark_id = 2;
  // The sequence number of that mark event (Event.sequence). The sidecar
  // reads the event from its log: the call fails with FAILED_PRECONDITION
  // when the event is no longer held, or when it is from another DCS process
  // or mission generation than the running one, since DCS gives the ID to
  // another mark there. A controller must act while the event is held. The
  // event must be a mark event (25 to 27) with this mark_id, else the call
  // fails with INVALID_ARGUMENT.
  uint64 event_sequence = 3;
}

message RemovePlayerMarkResponse {
  CommandResult result = 1;
}
