// Campaigns as first-class objects: one store each, one active per DCS.
syntax = "proto3";

package nanoprobe.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "nanoprobe/v1alpha1/common.proto";
import "nanoprobe/v1alpha1/mission.proto";
import "nanoprobe/v1alpha1/session.proto";

option java_multiple_files = true;
option java_package = "nanoprobe.v1alpha1";

// Changes need the controller lease. These calls name their campaign
// themselves, so they carry the lease and the idempotency key directly. A finished or suspended campaign stays
// readable through WorldService and EventsService by its ID.
service CampaignService {
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse);
  // Load the campaign's shell and restore it. Suspends the active one first.
  rpc ActivateCampaign(ActivateCampaignRequest) returns (ActivateCampaignResponse);
  // Capture, checkpoint and close the store. DCS keeps running unmanaged.
  rpc SuspendCampaign(SuspendCampaignRequest) returns (SuspendCampaignResponse);
  // As suspend, then the store becomes read-only with an outcome record.
  rpc FinishCampaign(FinishCampaignRequest) returns (FinishCampaignResponse);
  // The store as line-per-record text. The store file itself is a file in the
  // server's store folder and is copied from there.
  rpc ExportCampaign(ExportCampaignRequest) returns (stream ExportCampaignResponse);
  rpc DeleteCampaign(DeleteCampaignRequest) returns (DeleteCampaignResponse);
  // Take a backup of the campaign's store now (spec/persistence.md,
  // "Backups"). Refused with SPACE_LOW when the store's file system has less
  // free space than the store, its WAL and its events file. There is no
  // restore call: `nanoprobe restore`, with the server stopped, restores a
  // backup (spec/persistence.md, "Restore a backup").
  rpc BackupCampaign(BackupCampaignRequest) returns (BackupCampaignResponse);
  // The backups kept, oldest first. Needs no lease.
  rpc ListCampaignBackups(ListCampaignBackupsRequest) returns (ListCampaignBackupsResponse);
  // Set or remove the campaign's own template for one of its theaters: a
  // mission the author saved in the Mission Editor, used in place of the
  // shared one in [missions] dir. Its units stay unmanaged. Kept in the
  // campaign's store, so a backup or a copy of the campaign carries it.
  rpc SetCampaignTemplate(SetCampaignTemplateRequest) returns (SetCampaignTemplateResponse);
}

enum CampaignState {
  CAMPAIGN_STATE_UNSPECIFIED = 0;
  CAMPAIGN_STATE_ACTIVE = 1;
  CAMPAIGN_STATE_SUSPENDED = 2;
  CAMPAIGN_STATE_FINISHED = 3;
}

message Campaign {
  uint64 id = 1;
  string name = 2;
  CampaignState state = 3;
  // The maps the campaign uses.
  repeated string theaters = 4;
  // The one loaded now, empty unless active.
  string loaded_theater = 5;
  // The campaign's date and time.
  google.protobuf.Timestamp clock = 6;
  uint32 platform_schema = 7;
  // Author component schema versions by name.
  map<string, uint32> component_schemas = 8;
  google.protobuf.Timestamp created = 9;
  // Written by the controller when the campaign finished.
  google.protobuf.Struct outcome = 10;
  // The last checkpoint written to the store, absent before the first.
  CheckpointInfo last_checkpoint = 11;
  // The theaters the campaign has its own template for.
  repeated string templates = 12;
}

// A checkpoint of the observed state (spec/persistence.md, "Writes").
message CheckpointInfo {
  // When it was written.
  google.protobuf.Timestamp taken = 1;
  // The simulation's model time and mission generation it holds.
  Stamp sim = 2;
  // The period each sampling tier achieved when it was taken: a value in it
  // may be this old.
  SampleRates achieved = 3;
}

enum BackupReason {
  BACKUP_REASON_UNSPECIFIED = 0;
  // Every backup_interval_h while the campaign is active.
  BACKUP_REASON_SCHEDULED = 1;
  // BackupCampaign.
  BACKUP_REASON_MANUAL = 2;
  // Before a schema migration.
  BACKUP_REASON_PRE_MIGRATION = 3;
}

message Backup {
  // Counts up from 1 in the campaign's folder, never reused.
  uint32 id = 1;
  google.protobuf.Timestamp created = 2;
  // The store copy's size in bytes.
  uint64 size = 3;
  // The store's schema version when it was taken.
  uint32 schema = 4;
  BackupReason reason = 5;
}

message CreateCampaignRequest {
  Lease lease = 1;
  string name = 2;
  repeated string theaters = 3;
  // The theater to load first.
  string first_theater = 4;
  google.protobuf.Timestamp clock = 5;
  // Activate it once created. Otherwise it starts suspended, and the first
  // specs are written to it by its ID before it is activated.
  bool activate = 6;
  Idempotency idempotency = 7;
}

message CreateCampaignResponse {
  Campaign campaign = 1;
}

message ListCampaignsRequest {}

message ListCampaignsResponse {
  repeated Campaign campaigns = 1;
}

message GetCampaignRequest {
  uint64 campaign_id = 1;
}

message GetCampaignResponse {
  Campaign campaign = 1;
}

message ActivateCampaignRequest {
  Lease lease = 1;
  uint64 campaign_id = 2;
  Idempotency idempotency = 3;
}

message ActivateCampaignResponse {
  Campaign campaign = 1;
}

message SuspendCampaignRequest {
  Lease lease = 1;
  uint64 campaign_id = 2;
  Idempotency idempotency = 3;
}

message SuspendCampaignResponse {
  Campaign campaign = 1;
}

message FinishCampaignRequest {
  Lease lease = 1;
  uint64 campaign_id = 2;
  google.protobuf.Struct outcome = 3;
  Idempotency idempotency = 4;
}

message FinishCampaignResponse {
  Campaign campaign = 1;
}

message ExportCampaignRequest {
  uint64 campaign_id = 1;
}

message ExportCampaignResponse {
  // A run of whole lines, each one JSON record.
  bytes lines = 1;
}

message DeleteCampaignRequest {
  Lease lease = 1;
  uint64 campaign_id = 2;
  // Must equal the campaign's name.
  string confirm_name = 3;
  Idempotency idempotency = 4;
}

message DeleteCampaignResponse {}

message BackupCampaignRequest {
  Lease lease = 1;
  uint64 campaign_id = 2;
  Idempotency idempotency = 3;
}

message BackupCampaignResponse {
  Backup backup = 1;
}

message ListCampaignBackupsRequest {
  uint64 campaign_id = 1;
}

message ListCampaignBackupsResponse {
  repeated Backup backups = 1;
}

message SetCampaignTemplateRequest {
  Write write = 1;
  // One of the campaign's theaters; the template's `theatre` member must
  // name it exactly.
  string theater = 2;
  // The .miz file, at most 16 MiB. Empty removes the campaign's template.
  bytes miz = 3;
}

message SetCampaignTemplateResponse {
  Campaign campaign = 1;
}
