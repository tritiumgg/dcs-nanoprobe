// Desired state and effects. Controller only.
syntax = "proto3";

package nanoprobe.v1alpha1;

import "google/protobuf/struct.proto";
import "nanoprobe/v1alpha1/common.proto";
import "nanoprobe/v1alpha1/session.proto";
import "nanoprobe/v1alpha1/world.proto";

option java_multiple_files = true;
option java_package = "nanoprobe.v1alpha1";

// A set-state call returns when the desired state is journalled; it does not
// wait for DCS. An effect returns with its outcome.
service CommandsService {
  rpc PutGroup(PutGroupRequest) returns (PutGroupResponse);
  // Create a group from a group template of the DCS Mission Editor: one
  // entry of a `templates.lua` file the administrator provides. The sidecar
  // reads the file once and keeps the converted spec; nothing reads the file
  // again. The group is changed afterwards with PutGroup.
  rpc PutGroupFromTemplate(PutGroupFromTemplateRequest) returns (PutGroupFromTemplateResponse);
  // Create every vehicle group and static of a DCS static template (a
  // `.stm` file of the Mission Editor) the administrator provides, in one
  // store commit or not at all. The sidecar reads the file once and keeps
  // the converted specs; nothing reads the file again. Each entity is then
  // an ordinary group or static: give a group its orders with SetOrder.
  // One commit is not one DCS spawn: the entities spawn at the pace of
  // every materialization, and each shows a failure in its own last error.
  rpc PutFromStaticTemplate(PutFromStaticTemplateRequest) returns (PutFromStaticTemplateResponse);
  rpc PutStatic(PutStaticRequest) returns (PutStaticResponse);
  rpc SetOrder(SetOrderRequest) returns (SetOrderResponse);
  rpc SetOptions(SetOptionsRequest) returns (SetOptionsResponse);
  rpc Materialize(MaterializeRequest) returns (MaterializeResponse);
  rpc Dematerialize(DematerializeRequest) returns (DematerializeResponse);
  rpc RemoveEntity(RemoveEntityRequest) returns (RemoveEntityResponse);
  // Release a member held out of spawns (Unit.left MISSING or REMOVED, no
  // death fact): DEAD records a death fact, RESTORE lets the next spawn of
  // its group include it. Store-only, so it works on a suspended campaign.
  rpc ResolveMember(ResolveMemberRequest) returns (ResolveMemberResponse);
  rpc SetLostPolicy(SetLostPolicyRequest) returns (SetLostPolicyResponse);
  rpc SetAirbaseOwner(SetAirbaseOwnerRequest) returns (SetAirbaseOwnerResponse);
  rpc SetWarehouseStock(SetWarehouseStockRequest) returns (SetWarehouseStockResponse);
  // Add to or take from a warehouse's stock now. An effect: applied at most
  // once, never sent again. Once applied, it adds its amounts to the count
  // the controller set for each item it names, at least 0.
  rpc AdjustWarehouseStock(AdjustWarehouseStockRequest) returns (AdjustWarehouseStockResponse);
  // Read an entity's full state from DCS. With persistence off this and
  // PutGroup are the author's capture and restore: the captured units go back
  // as a spec.
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  rpc DoEffect(DoEffectRequest) returns (DoEffectResponse);
  rpc SetSampleRates(SetSampleRatesRequest) returns (SetSampleRatesResponse);
  // An earlier call, by its idempotency key: the campaign it acted on and,
  // for an effect or a query, its outcome and value. A set-state call has no
  // outcome of its own, so `result` is absent; follow the entity's applied
  // revisions in WorldService. Repeating a set-state call with the same key
  // returns its first response, revisions included. An unknown or expired
  // key is OUTCOME_NOT_FOUND.
  rpc GetOutcome(GetOutcomeRequest) returns (GetOutcomeResponse);
}

message UnitSpec {
  // 0 in a new group; the server assigns the ID.
  uint64 id = 1;
  string type = 2;
  string label = 3;
  Position position = 4;
  // Radians.
  double heading = 5;
  string skill = 6;
  // Further keys of the DCS unit table: payload, livery, callsign and so on.
  // Integer keys are written as decimal strings (spec/world.md).
  google.protobuf.Struct extra = 7;
  // State to spawn with, as a capture returned it. Absent spawns it new.
  // Life is a percentage of the type's initial life, above 0 and up to 100.
  optional double life_percent = 8;
  reserved 9, 10;
  reserved "fuel", "ammo";
  // Request only: the unit's pylons from a payload preset of the DCS
  // Mission Editor. PutGroup reads the named preset and stores its pylons
  // as `extra.payload.pylons`; the field itself is never stored, so it is
  // always empty in a spec read back from WorldService or a capture. A
  // spec that names a preset and also carries `extra.payload.pylons` is
  // refused: a controller that sends a read-back spec again with a preset
  // removes the pylons first. Other keys of `extra.payload` (`fuel`,
  // `flare`, `chaff`, `gun`) are kept as the request gives them; a preset
  // holds none. The controller supplies `fuel`, in kilograms: an aircraft
  // spawned with pylons and no `fuel` had 45 % of its internal fuel
  // (spec/world.md, "Payload presets").
  PayloadPreset payload_preset = 11;
}

// A payload preset in a file the administrator provides (spec/world.md,
// "Payload presets").
message PayloadPreset {
  // The preset file, as the sidecar opens it: an absolute path to a file
  // in a folder that `[missions] template_dirs` lists (spec/config.md).
  // One file of the editor's form: the sidecar does not merge the
  // editor's folders.
  string path = 1;
  // The preset's `name` in the file (not its `displayName`).
  string name = 2;
}

message GroupSpec {
  string label = 1;
  // The DCS country number.
  uint32 country = 2;
  GroupCategory category = 3;
  repeated UnitSpec units = 4;
  // Further keys of the DCS group table.
  google.protobuf.Struct extra = 5;
  // Start under campaign authority, not in DCS.
  bool virtual = 6;
  map<string, google.protobuf.Struct> components = 7;
}

message StaticSpec {
  string label = 1;
  uint32 country = 2;
  string type = 3;
  Position position = 4;
  double heading = 5;
  // Further keys of the DCS static table. A `dead` key is refused: use the
  // field below.
  google.protobuf.Struct extra = 6;
  // Create the static destroyed. It is in state `dead` from the start, and
  // DCS shows its ruin, spawned with `dead = true`, wherever a live static
  // would be in DCS. Some types have no destroyed model and show intact
  // (spec/world.md, "Ruins").
  bool dead = 7;
  // The further heliports of a heliport group: DCS makes one airbase of the
  // static and these, under the static's name, with one warehouse and every
  // unit's parking (spec/world.md, "Heliport groups"). Only for a static
  // whose `extra.category` is "Heliports", each unit's likewise, and not
  // with `dead`. The count is bound only by the size of one spawn command.
  // A revision may add or drop them, or move, turn or change the further
  // keys of a kept one; a kept one's type does not change.
  repeated StaticUnit further_units = 8;
}

// A further unit of a heliport group.
message StaticUnit {
  string type = 1;
  Position position = 2;
  double heading = 3;
  // Further keys of the DCS unit table. A `dead` key is refused.
  google.protobuf.Struct extra = 4;
}

message Waypoint {
  Position position = 1;
  // Meters per second.
  double speed = 2;
  // Follow roads to this point. Ground groups only.
  bool on_road = 3;
  // Further keys of the DCS waypoint table.
  google.protobuf.Struct extra = 4;
}

message RouteOrder {
  repeated Waypoint waypoints = 1;
}

message AttackOrder {
  // The group, unit or static to attack. A unit's group, or a static, that
  // gets new DCS object IDs gets the attack compiled again.
  uint64 target_id = 1;
}

message HoldOrder {}

message OrbitOrder {
  Position center = 1;
  double speed = 2;
  // Meters.
  double radius = 3;
}

// An order is stored as an intent. The server compiles what remains of it
// into a DCS task whenever DCS must be told again.
message Order {
  oneof intent {
    RouteOrder route = 1;
    AttackOrder attack = 2;
    HoldOrder hold = 3;
    OrbitOrder orbit = 4;
  }
}

message PutGroupRequest {
  Write write = 1;
  // 0 creates a group; otherwise replaces the spec of this one.
  uint64 group_id = 2;
  GroupSpec spec = 3;
  // Optional first order.
  Order order = 4;
}

message PutGroupResponse {
  uint64 group_id = 1;
  repeated uint64 unit_ids = 2;
  uint64 spec_revision = 3;
  // The store revision of the change.
  uint64 revision = 4;
}

message PutGroupFromTemplateRequest {
  Write write = 1;
  // The template file, as the sidecar opens it: an absolute path to a file
  // in a folder that `[missions] template_dirs` lists (spec/config.md).
  string path = 2;
  // The template's name in the file.
  string template = 3;
  // Where the template's origin goes. Each unit is placed at its offset from
  // this point, on its theater and at its altitude.
  Position anchor = 4;
  // Radians, clockwise from north. Turns the layout about the anchor and is
  // added to each unit's heading. 0 keeps the layout as the file has it.
  double heading = 5;
  // The DCS country number. Absent takes the template's own.
  optional uint32 country = 6;
  // The group's label. Empty takes the template's name.
  string label = 7;
  // Optional first order.
  Order order = 8;
}

message PutGroupFromTemplateResponse {
  uint64 group_id = 1;
  // In the template's unit order.
  repeated uint64 unit_ids = 2;
  uint64 spec_revision = 3;
  // The store revision of the change.
  uint64 revision = 4;
}

message PutFromStaticTemplateRequest {
  Write write = 1;
  // The static template file, as the sidecar opens it: an absolute path to
  // a file in a folder that `[missions] template_dirs` lists
  // (spec/config.md).
  string path = 2;
  // Where the layout's origin goes, on this position's theater and at its
  // altitude. The origin is the center of the box that bounds every unit's
  // and static's place in the file. Absent places every entity where the
  // file has it, on the file's `theatre`, which must be the campaign's.
  Position anchor = 3;
  // Radians, clockwise from north. Turns the layout about its origin and is
  // added to each unit's and static's heading. 0 keeps the file's layout.
  double heading = 4;
  // The DCS country number of every entity. Absent keeps each entity's
  // country in the file.
  optional uint32 country = 5;
  // Prefixed to each entity's label: `<label>/<name>`, with the name the
  // file gives its group. Empty gives each entity the file's name alone.
  string label = 6;
}

// A group the call made.
message StaticTemplateGroup {
  uint64 group_id = 1;
  // In the file's unit order.
  repeated uint64 unit_ids = 2;
  uint64 spec_revision = 3;
}

// A static the call made.
message StaticTemplateStatic {
  uint64 static_id = 1;
  uint64 spec_revision = 2;
}

message PutFromStaticTemplateResponse {
  // The vehicle groups in the order of the file's text, across its
  // coalitions and countries.
  repeated StaticTemplateGroup groups = 1;
  // The statics in the order of the file's text, likewise. A static group
  // whose every unit is a heliport is one entry: one static with its
  // further units (spec/world.md, "Heliport groups").
  repeated StaticTemplateStatic statics = 2;
  // The store revision of the one commit.
  uint64 revision = 3;
}

message PutStaticRequest {
  Write write = 1;
  // 0 creates a static; otherwise revises this one's spec in place, at one
  // new spec revision: its type, place on the same theater, heading,
  // `extra` and further units. Further unit i keeps its ID. The country, the
  // theater, whether `extra.category` is "Heliports", and `dead` do not
  // change. A heliport's type and its kept further units' types do not
  // change, and a destroyed static's spec is fixed (FAILED_PRECONDITION).
  // The static is spawned again under its name. A heliport's revision makes
  // a new airbase: the owner and stock set with SetAirbaseOwner and
  // SetWarehouseStock are sent to it, and the old airbase's last sampled
  // owner and items are carried where none is set. A change in DCS since
  // that sample is lost (spec/world.md, "Revising a static").
  uint64 static_id = 2;
  StaticSpec spec = 3;
}

message PutStaticResponse {
  uint64 static_id = 1;
  uint64 spec_revision = 2;
  uint64 revision = 3;
}

message SetOrderRequest {
  Write write = 1;
  uint64 group_id = 2;
  Order order = 3;
}

message SetOrderResponse {
  uint64 order_revision = 1;
  uint64 revision = 2;
}

message SetOptionsRequest {
  Write write = 1;
  uint64 group_id = 2;
  // Controller options by DCS option ID.
  map<uint32, google.protobuf.Value> options = 3;
}

message SetOptionsResponse {
  uint64 revision = 1;
}

message MaterializeRequest {
  Write write = 1;
  // Managed groups and statics.
  repeated uint64 entity_ids = 2;
}

message MaterializeResponse {
  uint64 revision = 1;
}

message DematerializeRequest {
  Write write = 1;
  repeated uint64 entity_ids = 2;
}

message DematerializeResponse {
  uint64 revision = 1;
}

message RemoveEntityRequest {
  Write write = 1;
  // A managed group, static, mark, drawing or menu item.
  uint64 entity_id = 2;
}

message RemoveEntityResponse {
  uint64 revision = 1;
}

enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  // A death fact with no killer, now.
  RESOLUTION_DEAD = 1;
  // The mark is cleared; the group's next spawn includes the member.
  RESOLUTION_RESTORE = 2;
}

message ResolveMemberRequest {
  Write write = 1;
  // A unit whose left is MISSING or REMOVED.
  uint64 unit = 2;
  Resolution resolution = 3;
}

message ResolveMemberResponse {
  uint64 revision = 1;
}

enum LostPolicy {
  LOST_POLICY_UNSPECIFIED = 0;
  LOST_POLICY_REPORT = 1;
  LOST_POLICY_RESPAWN = 2;
  LOST_POLICY_DEAD = 3;
}

message SetLostPolicyRequest {
  Write write = 1;
  // 0 sets the campaign's default.
  uint64 group_id = 2;
  LostPolicy policy = 3;
}

message SetLostPolicyResponse {
  uint64 revision = 1;
}

message SetAirbaseOwnerRequest {
  Write write = 1;
  string theater = 2;
  string airbase = 3;
  Coalition owner = 4;
}

message SetAirbaseOwnerResponse {
  uint64 revision = 1;
}

message SetWarehouseStockRequest {
  Write write = 1;
  string theater = 2;
  string airbase = 3;
  // Deprecated: use `weapon`. An alias for it; a name in both takes the
  // count in `weapon`.
  map<string, double> stock = 4;
  // Aircraft to set, by DCS type name.
  map<string, double> aircraft = 5;
  // Liquids to set, by number: 0 jet fuel, 1 gasoline, 2 MW-50, 3 diesel.
  map<uint32, double> liquids = 6;
  // Weapons to set, by DCS name. An item not named keeps its count.
  map<string, double> weapon = 7;
}

message SetWarehouseStockResponse {
  uint64 revision = 1;
}

message AdjustWarehouseStockRequest {
  Write write = 1;
  string theater = 2;
  string airbase = 3;
  // Amounts to add, by weapon name. A negative amount takes away.
  map<string, double> weapon = 4;
  map<string, double> aircraft = 5;
  // By liquid number, as in SetWarehouseStockRequest.
  map<uint32, double> liquids = 6;
}

message AdjustWarehouseStockResponse {
  CommandResult result = 1;
}

message CaptureRequest {
  Write write = 1;
  // A live group or static.
  uint64 entity_id = 2;
}

message CaptureResponse {
  CommandResult result = 1;
  Entity entity = 2;
}

message Explosion {
  Position position = 1;
  double power = 2;
}

message Smoke {
  Position position = 1;
  // The DCS smoke color number.
  uint32 color = 2;
}

message Flare {
  Position position = 1;
  uint32 color = 2;
  // Radians.
  double azimuth = 3;
}

message Illumination {
  Position position = 1;
  double power = 2;
}

message Damage {
  uint64 unit_id = 1;
  // The life to set, as a percentage of the unit's initial life, 0 to 100.
  double life_percent = 2;
}

// Whom a sound or a picture reaches.
enum EffectScope {
  EFFECT_SCOPE_UNSPECIFIED = 0;
  // Everyone. `target` is ignored.
  EFFECT_SCOPE_ALL = 1;
  // `target` is the DCS coalition number.
  EFFECT_SCOPE_COALITION = 2;
  // `target` is the EntityId of a live group.
  EFFECT_SCOPE_GROUP = 3;
  // `target` is the EntityId of a live unit.
  EFFECT_SCOPE_UNIT = 4;
  // `target` is the DCS country number.
  EFFECT_SCOPE_COUNTRY = 5;
}

// Play a sound file that is in the mission. DCS takes any file name without
// an error, so an applied outcome says only that DCS took the call.
message Sound {
  EffectScope scope = 1;
  uint64 target = 2;
  // The sound file's name in the mission.
  string file = 3;
}

// Show a picture. Its numbers are the Mission Editor's values for the same
// fields. An applied outcome says only that DCS took the call.
message Picture {
  EffectScope scope = 1;
  uint64 target = 2;
  // The picture's resource key in the mission, or its file name. Letters,
  // digits, space and `_.-/()+,#`, at most 255 bytes. DCS shows a picture by
  // its key and not by its bare file name, so a file name that the loaded
  // mission's `mapResource` keys is sent as its key.
  string file = 3;
  // How long the picture stays, 0 to 86400; 0 until PictureStop.
  double seconds = 4;
  // Clear the view first.
  bool clear_view = 5;
  // The picture's size, in `size_units`, at least 0.0001, at most 10000.
  double size = 6;
  uint32 horizontal = 7;
  uint32 vertical = 8;
  uint32 size_units = 9;
}

// Take every picture off screen.
message PictureStop {}

enum RadioModulation {
  RADIO_MODULATION_UNSPECIFIED = 0;
  RADIO_MODULATION_AM = 1;
  RADIO_MODULATION_FM = 2;
}

// Broadcast a sound file that is in the mission on a radio frequency, from a
// point, as the Mission Editor's "radio transmission" does. That a load or a
// DCS restart ends it is UNVERIFIED; the platform does not start it again.
message Broadcast {
  // 1 to 64 characters of letters, digits, space and `_.-`; BroadcastStop
  // names it.
  string name = 1;
  // The sound file's name in the mission: 1 to 255 bytes of letters, digits,
  // space and `_.-/()+,#`. DCS plays the file only by its path in the
  // mission (LIVE, docs/results/2026-11-26-mission-content.md, run 5), so a
  // file the loaded mission holds in `l10n/DEFAULT/` is sent as that path,
  // which must also fit 255 bytes; any other value is sent as given. That a
  // client hears a broadcast sent this way is UNVERIFIED.
  string file = 2;
  // The transmitter. `alt` is above sea level.
  Position position = 3;
  // Hertz, 200000 to 30000000000.
  uint64 frequency_hz = 4;
  RadioModulation modulation = 5;
  // Play the file again and again until BroadcastStop.
  bool loop = 6;
  // Watts, 1 to 10000. Absent is 100, the Mission Editor's default.
  optional double power_w = 7;
}

// Stop a broadcast by its name.
message BroadcastStop {
  string name = 1;
}

// A sphere, in DCS coordinates. The center's `alt` is above sea level, and 0
// is sea level: a 30 m sphere at 0 removed nothing on an airfield about
// 970 m above sea level (LIVE). To clear at the ground without its height,
// use `Column`.
message Sphere {
  Position center = 1;
  // Meters, above 0.
  double radius = 2;
}

// A box aligned with the axes, in DCS coordinates. Each of `min`'s
// coordinates is at most the same one of `max`. Each `alt` is above sea
// level, and 0 is sea level. To clear at the ground without its height, use
// `Column`.
message Box {
  Position min = 1;
  Position max = 2;
}

// A square on the map, at every height: 2 x `half_width` on a side, aligned
// with north and east, from 10 km below sea level to 100 km above it. It
// clears the ground at a place whose height the caller does not know: on
// ground 970 m up, a column of `half_width` 50 removed the wrecks under it
// and none 70 m past its edge (LIVE). Its corners reach 1.41 x `half_width`
// from the center, and the edge DCS applies is not exact: an 8 m sphere
// removed wrecks 10 and 30 m from its center (LIVE).
message Column {
  // Only `theater`, `north` and `east` are read. `alt` is ignored.
  Position center = 1;
  // Meters, a finite number above 0. Each edge, `north` and `east` less and
  // plus `half_width`, is within 10,000 km of 0.
  double half_width = 2;
}

// The map: x and z from -2,000 km to 2,000 km. That this covers every
// theater is UNVERIFIED.
message WholeMap {}

// Remove wrecks, craters and debris. DCS removes the wrecks of ground units
// that have stopped burning; craters count as junk too (inferred from the
// count). It also destroys every dead static in the volume that the
// platform does not manage, so its ruin leaves the clients' screens. A
// managed static, dead or alive, stays, with its record.
// It leaves every live unit and static, a wreck that is still burning and
// destroyed scenery. Around a dead aircraft it removes something; what is
// UNVERIFIED. A burning wreck it leaves still explodes and sends its death
// events. Coordinates and sizes are within 10,000 km of 0, except a column's
// `alt`, which is not read.
message ClearDebris {
  oneof volume {
    Sphere sphere = 1;
    Box box = 2;
    // Sent to DCS as several boxes, so that no single command clears the
    // whole map at once.
    WholeMap whole_map = 3;
    // Sent to DCS as one box, from 10 km below sea level to 100 km above
    // it.
    Column column = 4;
  }
}

message Effect {
  oneof effect {
    Explosion explosion = 1;
    Smoke smoke = 2;
    Flare flare = 3;
    Illumination illumination = 4;
    Damage damage = 5;
    Sound sound = 6;
    Picture picture = 7;
    PictureStop picture_stop = 8;
    ClearDebris clear_debris = 9;
    Broadcast broadcast = 10;
    BroadcastStop broadcast_stop = 11;
  }
}

// At-most-once: an effect is never sent to DCS twice.
message DoEffectRequest {
  Write write = 1;
  Effect effect = 2;
}

message DoEffectResponse {
  CommandResult result = 1;
  // For ClearDebris: how many junk objects DCS removed, craters and debris
  // included, plus the dead statics in the volume it destroyed. For a
  // whole-map clear that did not apply, the count of the boxes that did.
  // Absent when the clear has no result (unknown, not_sent) and for any
  // other effect.
  optional uint64 debris_removed = 2;
}

message SetSampleRatesRequest {
  Write write = 1;
  // Target periods in seconds; 0 keeps the agent's default.
  double position_period = 2;
  double vitals_period = 3;
  double warehouse_period = 5;
  double enumeration_period = 6;
  reserved 4;
  reserved "ammo_period";
}

message SetSampleRatesResponse {}

// Keys are remembered server-wide, so the request names no campaign. Fails
// with OUTCOME_NOT_FOUND for a key that is unknown or no longer remembered.
message GetOutcomeRequest {
  string idempotency_key = 1;
}

// The final response of the call, as the call would have returned it.
message GetOutcomeResponse {
  CommandResult result = 1;
  // The value, for InvokeLua and EvalLua.
  google.protobuf.Value value = 2;
  // The entity, for Capture.
  Entity entity = 3;
  // The campaign the call resolved to, 0 for none.
  uint64 campaign_id = 4;
  // For ClearDebris, as DoEffectResponse gave it.
  optional uint64 debris_removed = 5;
}
