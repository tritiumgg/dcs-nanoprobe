// Events: never conflated, resumable from a sequence number.
syntax = "proto3";

package nanoprobe.v1alpha1;

import "google/protobuf/struct.proto";
import "nanoprobe/v1alpha1/common.proto";
import "nanoprobe/v1alpha1/session.proto";
import "nanoprobe/v1alpha1/world.proto";

option java_multiple_files = true;
option java_package = "nanoprobe.v1alpha1";

service EventsService {
  // Events from a sequence number onward, then live.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SubscribeEventsResponse);
  // A page of history.
  rpc ReadEvents(ReadEventsRequest) returns (ReadEventsResponse);
}

// Every field but sequence and stamp is optional: DCS does not always send
// the same fields for one event type.
message Event {
  // Grows by one per event within a campaign, or within the server log.
  uint64 sequence = 1;
  Stamp stamp = 2;
  oneof body {
    WorldEvent world = 3;
    PlayerEvent player = 4;
    AuthorEvent author = 5;
    MenuEvent menu = 6;
    Gap gap = 7;
    LifecycleEvent lifecycle = 8;
    RouteEvent route = 10;
    ModerationEvent moderation = 11;
    LoadoutEvent loadout = 12;
  }
  // The campaign the sequence number belongs to, 0 for the server log.
  uint64 campaign_id = 9;
}

// A DCS world event.
message WorldEvent {
  // The DCS event ID.
  uint32 dcs_id = 1;
  // The event's name where the platform knows it, such as "kill".
  string name = 2;
  optional uint64 initiator_id = 3;
  optional uint64 target_id = 4;
  // Player keys in the initiator and in the target when it happened.
  repeated string initiator_players = 5;
  repeated string target_players = 6;
  optional string weapon = 7;
  // The airbase the event names.
  optional string place = 8;
  Position position = 9;
  optional string text = 10;
  // Rounds expended, for a shooting-end event: from the event where DCS
  // sends a count, otherwise absent.
  optional uint32 rounds = 11;
  // Fields the platform read and has no typed field for.
  google.protobuf.Struct extra = 12;
  // The DCS type names of the initiator and the target: the event's own
  // when it carries them, else the type the mission's table held for the
  // object.
  optional string initiator_type = 13;
  optional string target_type = 14;
  // Model time of the kill, for a KILL or DEAD: the victim's BDA time when
  // one came, else the time the victim's row left the table. DCS's own time
  // of the event stays in extra.time. A weapon kill's KILL and DEAD come up
  // to 103 s after the object stopped existing; this is the time to count.
  optional double dated_time = 15;
  // The players who launched the weapon of a HIT or KILL. initiator_players
  // is never rewritten; this is a separate attribution.
  repeated string launch_players = 16;
  LaunchRule launch_rule = 17;
  // The DCS mark ID of a mark event (added, changed, removed).
  optional uint64 mark_id = 18;
  // True when the platform issued mark_id in the DCS process that made the
  // event: the mark is one of the platform's own marks or drawings, shown or
  // retired. False for a player's mark and when mark_id is absent. A
  // controller uses it to tell the platform's own mark events from a
  // player's.
  bool platform_mark = 19;
}

// How launch_players was found (spec/world.md, "Launch attribution").
enum LaunchRule {
  LAUNCH_RULE_UNSPECIFIED = 0;
  // The event names a weapon whose shooter the sidecar saw at SHOT.
  LAUNCH_RULE_WEAPON = 1;
  // The weapon is unknown, as for a gun: the initiator's occupants before it
  // left.
  LAUNCH_RULE_INITIATOR = 2;
}

enum RouteEventKind {
  ROUTE_EVENT_KIND_UNSPECIFIED = 0;
  // A waypoint of the group's route was reached.
  ROUTE_EVENT_KIND_WAYPOINT_REACHED = 1;
  // The last waypoint was reached; one per route, after its last
  // WAYPOINT_REACHED.
  ROUTE_EVENT_KIND_ROUTE_COMPLETE = 2;
}

// Progress of a group along its route order (spec/world.md, "Route
// progress"). The sidecar writes it from position samples, so it is as
// current as they are.
message RouteEvent {
  RouteEventKind kind = 1;
  // The group.
  uint64 group_id = 2;
  // The order revision the route was given at.
  uint64 order_revision = 3;
  // The waypoint's index in the order's own numbering, from 0. Not set for
  // ROUTE_COMPLETE.
  optional uint32 waypoint_index = 4;
  // Model time of the position sample that showed it, in seconds.
  double model_time = 5;
  // True when the position was observed in DCS, false when the controller
  // wrote it.
  bool observed = 6;
}

enum PlayerEventKind {
  PLAYER_EVENT_KIND_UNSPECIFIED = 0;
  PLAYER_EVENT_KIND_CONNECT = 1;
  PLAYER_EVENT_KIND_DISCONNECT = 2;
  PLAYER_EVENT_KIND_ENTER_UNIT = 3;
  PLAYER_EVENT_KIND_LEAVE_UNIT = 4;
  PLAYER_EVENT_KIND_CHAT = 5;
  PLAYER_EVENT_KIND_RENAME = 6;
}

message PlayerEvent {
  PlayerEventKind kind = 1;
  string player_key = 2;
  string name = 3;
  optional uint64 unit_id = 4;
  optional uint32 seat = 5;
  optional string text = 6;
  Coalition coalition = 7;
}

// An event from emit, an extension or PublishEvent.
message AuthorEvent {
  string name = 1;
  // Any value: emit accepts nil, a boolean, a number, a string or a table.
  google.protobuf.Value payload = 2;
  repeated string player_keys = 3;
  // The units the event is about.
  repeated uint64 entity_ids = 4;
}

enum MenuAttribution {
  MENU_ATTRIBUTION_UNSPECIFIED = 0;
  // DCS named the player who selected the item: player_keys holds that one.
  MENU_ATTRIBUTION_SELECTOR = 1;
  // DCS did not say. player_keys holds the players who could have selected
  // it by occupancy and connection when the record arrived; the platform
  // never picks one. To know exactly who chose an item, give it to a group
  // with one player seat.
  MENU_ATTRIBUTION_AUDIENCE = 2;
}

// A player selected a menu item.
message MenuEvent {
  uint64 item_id = 1;
  // With SELECTOR the player; with AUDIENCE the candidates.
  repeated string player_keys = 2;
  MenuAttribution attribution = 3;
}

enum ModerationAction {
  MODERATION_ACTION_UNSPECIFIED = 0;
  MODERATION_ACTION_KICK = 1;
  MODERATION_ACTION_BAN = 2;
  MODERATION_ACTION_UNBAN = 3;
  MODERATION_ACTION_MOVE = 4;
}

// The ammunition of a unit a player occupies, read at the unit's birth or
// takeoff. One event per read, for a unit the store holds and for an adopted
// one. It follows the world event that caused the read (spec/world.md,
// "Ammunition").
message LoadoutEvent {
  // The unit the players occupy.
  uint64 unit_id = 1;
  uint64 group_id = 2;
  // The unit's type name.
  string type = 3;
  // The players in the unit, by seat.
  repeated string player_keys = 4;
  // Counts by weapon type name; rows of one type are added up.
  map<string, uint32> ammo = 5;
  // The cause of the read and the stamps it was made under.
  AmmoRead read = 6;
}

// A moderation call DCS applied.
message ModerationEvent {
  ModerationAction action = 1;
  // The player acted on. Never a ucid.
  string player_key = 2;
  string reason = 3;
  // The role of the token that made the call.
  Role role = 4;
  CommandResult result = 5;
}

// Events in this span were lost. A consumer marks what overlaps it as
// incomplete.
// The agent reports a gap in DCS real time; the server converts the ends to
// wall-clock time with the offset it tracks, so the wall times are estimates.
// The stamps carry no frame.
message Gap {
  Stamp from = 1;
  Stamp to = 2;
  uint32 lost = 3;
}

enum SimState {
  SIM_STATE_UNSPECIFIED = 0;
  SIM_STATE_STARTING = 1;
  SIM_STATE_LOADING = 2;
  SIM_STATE_RUNNING = 3;
  SIM_STATE_PAUSED = 4;
  SIM_STATE_STOPPING = 5;
  SIM_STATE_DISABLED = 6;
  // The health verdict is gone: no DCS process holds a running agent. A DCS
  // the server is not attached to still reports its own state.
  SIM_STATE_GONE = 7;
  // The health verdict is hung: DCS holds the port or the mapped file but
  // its heartbeat stands still past the limit (a stall, a crash-report
  // window, a load past loading_limit_s). A lifecycle event carries it when
  // the verdict enters hung, and the state DCS shows when it leaves.
  SIM_STATE_HUNG = 8;
}

message LifecycleEvent {
  SimState state = 1;
  string theater = 2;
}

// Gap and lifecycle events pass every filter.
message EventFilter {
  // The campaign to read, 0 for the active one.
  uint64 campaign_id = 1;
  // Only these DCS event IDs; empty for all.
  repeated uint32 dcs_ids = 2;
  // Only events that name this player.
  string player_key = 3;
  // Read the server log: events recorded while no campaign was active.
  // campaign_id must be 0.
  bool server_log = 4;
}

message SubscribeEventsRequest {
  EventFilter filter = 1;
  // Send events after this sequence number. 0 starts at the oldest retained.
  uint64 after_sequence = 2;
  // Start at the newest event instead.
  bool live_only = 3;
}

message SubscribeEventsResponse {
  Event event = 1;
}

message ReadEventsRequest {
  EventFilter filter = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message ReadEventsResponse {
  repeated Event events = 1;
  // True when more history follows the last event.
  bool more = 2;
}
