// The world: list, then watch.
syntax = "proto3";

package nanoprobe.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "nanoprobe/v1alpha1/common.proto";

option java_multiple_files = true;
option java_package = "nanoprobe.v1alpha1";

// The world of one campaign, active or archived. A call that names campaign
// 0 while no campaign is active fails with NO_ACTIVE_CAMPAIGN.
service WorldService {
  // A snapshot at one revision.
  rpc ListWorld(ListWorldRequest) returns (stream ListWorldResponse);
  // Changes since a revision. A consumer that falls behind is ended with
  // CONSUMER_TOO_SLOW and lists again.
  rpc WatchWorld(WatchWorldRequest) returns (stream WatchWorldResponse);
  // Entities near a point.
  rpc QueryArea(QueryAreaRequest) returns (QueryAreaResponse);
}

// The lifecycle of a managed group or static (spec/world.md).
enum EntityState {
  ENTITY_STATE_UNSPECIFIED = 0;
  ENTITY_STATE_VIRTUAL = 1;
  ENTITY_STATE_MATERIALIZING = 2;
  ENTITY_STATE_LIVE = 3;
  ENTITY_STATE_DEMATERIALIZING = 4;
  ENTITY_STATE_DEAD = 5;
  ENTITY_STATE_LOST = 6;
  ENTITY_STATE_UNSPAWNABLE = 7;
}

// How often a subscription wants positions.
enum RateClass {
  RATE_CLASS_UNSPECIFIED = 0;
  // The default tier rate.
  RATE_CLASS_NORMAL = 1;
  // As fast as the cap allows.
  RATE_CLASS_FAST = 2;
  // Only when the store checkpoints.
  RATE_CLASS_SLOW = 3;
}

message Unit {
  uint64 id = 1;
  uint64 group_id = 2;
  // The DCS type name.
  string type = 3;
  // The author's label.
  string label = 4;
  bool alive = 5;
  Position position = 6;
  // As DCS sampled it. A unit DCS has not sampled has a heading derived from
  // its movement, with pitch and roll 0, or no attitude if it has not moved.
  Attitude attitude = 7;
  // Meters per second, derived from position changes.
  double speed = 8;
  // DCS's own life value. Its scale depends on the unit type; life_max is the
  // value the unit started with.
  optional double life = 9;
  // A player-occupied unit's ammunition by weapon type name, as `getAmmo`
  // listed it at the read that `ammo_read` names. Empty for an AI unit, for a
  // unit with no read yet, for a player unit the agent does not mark
  // (spec/sampling.md, "Loadout reads"), and for one with no ammunition. DCS
  // sends no event
  // for a rearm of an AI unit (E38), and none is known for a player aircraft,
  // so a rearm is not read (spec/world.md, "Ammunition").
  map<string, uint32> ammo = 11;
  // The read that gave `ammo`: its cause and the stamps it was read under.
  // Absent when no read was made.
  AmmoRead ammo_read = 16;
  // Player keys of the occupants, by seat.
  repeated string occupants = 12;
  Stamp sampled = 13;
  optional double life_max = 14;
  // How the unit left DCS without a death fact, if it did. While the mark
  // stands, no spawn includes the unit. A death fact or the unit being found
  // again releases it. A mark the agent reported outlives a mission load
  // until the controller removes the group; a mark inferred at an
  // enumeration's end clears at the load (spec/world.md, "Respawn gate").
  UnitLeft left = 15;
  reserved 10;
  reserved "fuel";
}

// The read of a player-occupied unit's ammunition.
message AmmoRead {
  AmmoReadCause cause = 1;
  // When the read was made.
  Stamp read = 2;
}

enum AmmoReadCause {
  AMMO_READ_CAUSE_UNSPECIFIED = 0;
  // The unit's birth: a player took its slot.
  AMMO_READ_CAUSE_BIRTH = 1;
  // The unit's takeoff.
  AMMO_READ_CAUSE_TAKEOFF = 2;
}

enum UnitLeft {
  // It has not left, or it is dead.
  UNIT_LEFT_UNSPECIFIED = 0;
  // DCS no longer has it and the cause is unknown: it may be dead.
  UNIT_LEFT_MISSING = 1;
  // DCS no longer has it and the read showed a removal, not a kill.
  UNIT_LEFT_REMOVED = 2;
}

message Group {
  uint64 id = 1;
  string label = 2;
  bool managed = 3;
  EntityState state = 4;
  Coalition coalition = 5;
  // The DCS country number.
  uint32 country = 6;
  GroupCategory category = 7;
  repeated Unit units = 8;
  // Changes when the spec changes, and when a lost group is spawned again,
  // whose spec may be the same (spec/world.md, "Revisions").
  uint64 spec_revision = 9;
  // The spec revision DCS has applied.
  uint64 applied_spec_revision = 15;
  // Changes when the order changes, and when the target of a sent or applied
  // attack order gets new DCS object IDs (spec/world.md, "Revisions").
  uint64 order_revision = 10;
  // The order revision DCS has been given.
  uint64 applied_order_revision = 11;
  // The engine's error for an unspawnable group.
  string last_error = 12;
  // The theater the group is on.
  string theater = 13;
  // Author components by name.
  map<string, google.protobuf.Struct> components = 14;
}

message Static {
  uint64 id = 1;
  string label = 2;
  bool managed = 3;
  string type = 4;
  Coalition coalition = 5;
  uint32 country = 6;
  // False for a destroyed static. A destroyed managed static stays listed,
  // in state `dead`, where it stood: DCS shows its ruin (spec/world.md,
  // "Ruins"). Only RemoveEntity takes it out.
  bool alive = 7;
  Position position = 8;
  double heading = 9;
  optional double life = 10;
  EntityState state = 11;
  // The engine's error for an unspawnable static, or for a dead static
  // whose ruin DCS refused, until a spawn of the ruin applies
  // (spec/world.md, "Ruins").
  string last_error = 12;
  // Changes when the spec changes, and when a lost static is spawned again,
  // whose spec may be the same (spec/world.md, "Revisions").
  uint64 spec_revision = 13;
  uint64 applied_spec_revision = 14;
}

message Airbase {
  string theater = 1;
  // The DCS name.
  string name = 2;
  Coalition owner = 3;
  // Stock by item name, as DCS's getInventory lists it. Absent until
  // sampled. An unlimited warehouse lists no item of an unlimited kind,
  // unless a script or a WAREHOUSE_ADJUST added some, and each liquid of
  // unlimited fuel at 100,000 (spec/commands.md, "Layout: WAREHOUSE_SET").
  map<string, double> stock = 4;
}

// A map mark the controller set.
message Mark {
  uint64 id = 1;
  Audience audience = 2;
  Position position = 3;
  string text = 4;
  bool read_only = 5;
  uint64 spec_revision = 6;
  // The revision DCS has applied, and the error if DCS refused the last one.
  // 0 while its markup group is hidden.
  uint64 applied_spec_revision = 7;
  string last_error = 8;
  // Unique among the campaign's live marks and drawings; empty for none.
  string label = 9;
  // The markup group it is drawn in; empty for none.
  string markup_group = 10;
  // The campaign model time it expires at, seconds (spec/world.md, "Labels
  // and markup groups"). Absent when it does not expire.
  optional double expires_at = 11;
  // Output only: the DCS ID the item is drawn under. 0 while it is hidden or
  // not yet drawn. It changes on every add: a full set, a show, a mission
  // load, a restart. Set by the sidecar and ignored on input. To tell the
  // platform's own mark events from a player's, read WorldEvent.platform_mark.
  uint64 dcs_id = 12;
}

// A color, each part from 0 to 1.
message Color {
  double red = 1;
  double green = 2;
  double blue = 3;
  double alpha = 4;
}

// A drawing's outline (spec/world.md, "Drawings").
enum LineType {
  // Solid.
  LINE_TYPE_UNSPECIFIED = 0;
  LINE_TYPE_SOLID = 1;
  LINE_TYPE_DASHED = 2;
  LINE_TYPE_DOTTED = 3;
  LINE_TYPE_DASH_DOT = 4;
  LINE_TYPE_LONG_DASH = 5;
  // A long dash and a short dash.
  LINE_TYPE_TWO_DASH = 6;
  // No outline.
  LINE_TYPE_NONE = 7;
}

// A point on the map: meters north and east, map-local (DCS x and z).
message MapPoint {
  double north = 1;
  double east = 2;
}

// What a drawing draws, and its style (spec/world.md, "Drawings"). Every
// coordinate is within 10,000 km of 0 and every size from 1 m to 10,000 km.
// A heading is radians clockwise from north, of the length axis.
message DrawingShape {
  // A line through two points.
  message Line {
    MapPoint from = 1;
    MapPoint to = 2;
  }
  // An arrow from one point to another.
  message Arrow {
    MapPoint from = 1;
    MapPoint to = 2;
  }
  // A polygon through 2 to 7,990 points; 2 draw a line, 3 or more a filled
  // polygon.
  message Polygon {
    repeated MapPoint points = 1;
  }
  // A text box at a point: the text is `text`, the background `fill`.
  message TextBox {
    MapPoint at = 1;
    // A whole number from 1 to 100.
    uint32 font_size = 2;
  }
  // A quad through exactly four corners, in order round the outline.
  message Quad {
    repeated MapPoint corners = 1;
  }
  // A freeform through 3 to 7,990 points, in order round the outline. An
  // outline that crosses itself draws no fill.
  message Freeform {
    repeated MapPoint points = 1;
  }
  message Circle {
    MapPoint center = 1;
    double radius = 2;
  }
  // Drawn as a quad.
  message Rectangle {
    MapPoint center = 1;
    double length = 2;
    double width = 3;
    double heading = 4;
  }
  // Drawn as a freeform of 36 points.
  message Oval {
    MapPoint center = 1;
    double half_length = 2;
    double half_width = 3;
    double heading = 4;
  }
  // Drawn as a freeform of 36 to 40 points.
  message RoundedRectangle {
    MapPoint center = 1;
    double length = 2;
    double width = 3;
    // From 1 m to half the shorter of length and width.
    double corner_radius = 4;
    double heading = 5;
  }

  // The map, as Position.theater: one of the campaign's theaters. Empty on a
  // drawing put through the deprecated fields, which passes no area filter.
  string theater = 1;
  // The outline, and a text box's text. Absent: opaque black.
  Color color = 2;
  // The inside, and a text box's background. Absent: no fill.
  Color fill = 3;
  // A text box takes LINE_TYPE_UNSPECIFIED or LINE_TYPE_SOLID; any other value
  // is INVALID_ARGUMENT.
  LineType line_type = 4;
  // A text box's text; for any other kind the message of its map panel.
  string text = 5;
  bool read_only = 6;
  oneof kind {
    Line line = 10;
    Polygon polygon = 11;
    Arrow arrow = 12;
    TextBox text_box = 13;
    Quad quad = 14;
    Freeform freeform = 15;
    Circle circle = 16;
    Rectangle rectangle = 17;
    Oval oval = 18;
    RoundedRectangle rounded_rectangle = 19;
  }
}

// A map drawing the controller set.
message Drawing {
  uint64 id = 1;
  Audience audience = 2;
  // Deprecated: read typed_shape. The markupToAll shape number the drawing is
  // sent as; 0 for a circle.
  uint32 shape = 3 [deprecated = true];
  // Deprecated: read typed_shape. The arguments the drawing is sent as, after
  // the coalition and the ID; empty for a circle.
  google.protobuf.ListValue args = 4 [deprecated = true];
  uint64 spec_revision = 5;
  // 0 while its markup group is hidden.
  uint64 applied_spec_revision = 6;
  string last_error = 7;
  // Unique among the campaign's live marks and drawings; empty for none.
  string label = 8;
  // The markup group it is drawn in; empty for none.
  string markup_group = 9;
  // The campaign model time it expires at, seconds. Absent when it does not
  // expire.
  optional double expires_at = 10;
  // Output only: the DCS ID the item is drawn under. 0 while it is hidden or
  // not yet drawn. It changes on every add: a full set, a show, a mission
  // load, a restart. Set by the sidecar and ignored on input. To tell the
  // platform's own mark events from a player's, read WorldEvent.platform_mark.
  uint64 dcs_id = 11;
  // What it draws. A drawing put through the deprecated fields reads back as
  // the kind its shape number names.
  DrawingShape typed_shape = 12;
}

// A named set of marks and drawings, shown or hidden together (spec/world.md,
// "Labels and markup groups").
message MarkupGroup {
  // 1 to 64 bytes with no control character; unique in the campaign.
  string name = 1;
  // PutMarkupGroup sets it as given: false hides the group. A group that a put of an
  // item creates is visible.
  bool visible = 2;
  // Model seconds an item put in the group lives, when its put gives none.
  optional double expire_after_s = 4;
  // The most live items the group holds: a put over it removes the oldest.
  optional uint32 cap = 5;
  reserved 3, 6;
  reserved "order", "slots_left";
}

// An F10 menu item the controller set.
message MenuItem {
  uint64 id = 1;
  // The parent submenu, 0 for the root.
  uint64 parent_id = 2;
  Audience audience = 3;
  string text = 4;
  bool submenu = 5;
  uint64 spec_revision = 6;
  uint64 applied_spec_revision = 7;
  string last_error = 8;
}

message Entity {
  oneof kind {
    Group group = 1;
    Static static = 2;
    Airbase airbase = 3;
    Mark mark = 4;
    Drawing drawing = 5;
    MenuItem menu_item = 6;
  }
}

// What a list or a watch covers. Empty covers everything.
message WorldFilter {
  // The campaign to read, 0 for the active one. An archived campaign is
  // listed, never watched.
  uint64 campaign_id = 1;
  repeated Coalition coalitions = 2;
  // Units are listed inside their groups: ENTITY_KIND_UNIT here fails with
  // INVALID_FIELD.
  repeated EntityKind kinds = 3;
  // Only entities within radius of center. A drawing passes when any part of
  // it is within radius: its line, its point, its disc, or its outline and
  // inside. A drawing on another theater, or with an empty theater (put through
  // the deprecated fields), never passes.
  Position center = 4;
  double radius = 5;
  // Leave unmanaged entities out.
  bool managed_only = 6;
  // Only marks and drawings in these markup groups; "" names items with no
  // markup group. Empty does not filter. Other kinds pass.
  repeated string markup_groups = 7;
}

message ListWorldRequest {
  WorldFilter filter = 1;
}

message ListWorldResponse {
  // The same in every message of one list. Watch from it.
  uint64 revision = 1;
  repeated Entity entities = 2;
  // The campaign the revision belongs to. A watch that continues from this
  // list names it, not 0.
  uint64 campaign_id = 3;
}

message WatchWorldRequest {
  WorldFilter filter = 1;
  // Send changes after this revision. Fails with REVISION_EXPIRED when the
  // store no longer keeps the changes since it. The first message may also
  // carry the last state of an entity that changed since this revision and
  // no longer passes the filter, such as one that died or left the area; a
  // consumer that does not hold it drops it.
  uint64 since_revision = 2;
  RateClass rate = 3;
  // The shortest time between two position updates of one unit. A period
  // under the server's cap is served at the cap.
  google.protobuf.Duration min_period = 4;
}

// Positions of many units, columnar.
message PositionBatch {
  string theater = 1;
  repeated uint64 unit_id = 2 [packed = true];
  repeated double north = 3 [packed = true];
  repeated double east = 4 [packed = true];
  repeated double alt = 5 [packed = true];
  Stamp sampled = 6;
}

// Who removed an entity (spec/world.md, "Removal" and "Expiry").
enum RemovalCause {
  REMOVAL_CAUSE_UNSPECIFIED = 0;
  // The controller, with RemoveEntity.
  REMOVAL_CAUSE_CONTROLLER = 1;
  // The sidecar: a dead group past dead_keep_h, or a mark or drawing past
  // its expiry.
  REMOVAL_CAUSE_EXPIRED = 2;
  // The sidecar: the oldest item of a markup group over its cap.
  REMOVAL_CAUSE_EVICTED = 3;
}

// An entity the watcher held was removed. It follows the upsert of
// the entity's last state.
message Removal {
  uint64 id = 1;
  RemovalCause cause = 2;
}

message WorldChange {
  oneof change {
    // An entity appeared or changed anything but a position.
    Entity upsert = 1;
    // An entity the watcher held left the store (its rows were purged)
    // before the watch read its removal.
    uint64 removed_id = 2;
    PositionBatch positions = 3;
    Removal removal = 4;
  }
}

// A watch that names campaign 0 follows the campaign active when it starts
// and ends with CAMPAIGN_NOT_ACTIVE when another becomes active.
message WatchWorldResponse {
  // The store revision after these changes.
  uint64 revision = 1;
  repeated WorldChange changes = 2;
  // The campaign the revision belongs to.
  uint64 campaign_id = 3;
}

message QueryAreaRequest {
  WorldFilter filter = 1;
}

message QueryAreaResponse {
  uint64 revision = 1;
  repeated Entity entities = 2;
  uint64 campaign_id = 3;
}
