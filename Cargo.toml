# The workspace. `nanoprobe` is the working project name.

[workspace]
resolver = "3"
members = [
    "crates/sidecar",
    "crates/sim-fake",
    "crates/transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/tritiumgg/dcs-nanoprobe"
authors = ["tritiumgg"]

# The agent catches every panic at its entry points (CLAUDE.md, "Code inside
# DCS"), which needs unwinding. Do not switch this profile to abort.
[profile.release]
panic = "unwind"

# The agent is a DLL in DCS's process doing raw FFI into Lua.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
