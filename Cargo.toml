# The workspace. `nanoprobe` is the working project name.

[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/agent-link",
    "crates/api",
    "crates/cli",
    "crates/fake-agent",
    "crates/fake-sidecar",
    "crates/install",
    "crates/proto",
    "crates/sidecar",
    "crates/sim-fake",
    "crates/transport",
    "crates/xtask",
    "examples/hello-rust",
]
# Built with a nightly toolchain by `mise run fuzz`.
exclude = ["crates/transport/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/tritiumgg/dcs-nanoprobe"
authors = ["tritiumgg"]

# The agent catches every panic at its entry points (CLAUDE.md, "Code inside
# DCS"), which needs unwinding. Do not switch this profile to abort.
[profile.release]
panic = "unwind"
# Line tables let a crash record's module offsets be turned into source lines
# with the build's PDB (`cargo xtask symbolize`). They do not change the code.
debug = "line-tables-only"

# The agent is a DLL in DCS's process doing raw FFI into Lua.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
# The transport's Loom tests build with `--cfg loom`, and its fuzz targets with
# `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(fuzzing)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
