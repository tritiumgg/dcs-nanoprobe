# Every development tool for this project comes from here. Nothing is installed
# globally. Run `mise install` in the repository root.
#
# The Rust version is pinned in rust-toolchain.toml, not here. mise's rust tool sets
# RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml and discards its
# `components` and `targets`. Clearing the variable and enabling the idiomatic
# version file for rust puts rust-toolchain.toml in charge, and mise still
# installs the channel it names.

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[env]
RUSTUP_TOOLCHAIN = ""

[tools]
# Stock Lua 5.1 for the host tests. The plugin builds it from source with make,
# which a Windows host lacks, and the host Lua test is skipped on Windows. On
# Linux the build needs the readline and ncurses headers, which mise does not
# install (`libreadline-dev libncurses-dev` on Debian and Ubuntu).
lua = { version = "5.1.5", os = ["linux", "macos"] }
lua-language-server = "3.19.2"
buf = "1.75.0"
gitleaks = "8.30.1"
gh = "2.97.0"
# The lint of .github/workflows (`mise run check`). actionlint runs shellcheck
# on each step's script when shellcheck is on PATH, so it is pinned too. The
# lint runs on Linux and macOS, like the rest of the check task.
actionlint = { version = "1.7.12", os = ["linux", "macos"] }
shellcheck = { version = "0.11.0", os = ["linux", "macos"] }

# The static Linux sidecar for its container (`mise run sidecar-linux`): zig is
# the C compiler for the bundled SQLite, through tools/zigcc-musl.sh.
zig = "0.15.2"

# The Python hello campaign (examples/hello-python). uv installs its pinned
# dependencies into examples/hello-python/.venv from uv.lock.
python = "3.12.13"
uv = "0.12.17"

# The Kotlin hello campaign (examples/hello-kotlin). Gradle fetches the Kotlin,
# protobuf and gRPC plugins and libraries the build names from Maven Central.
java = "temurin-21.0.13+9.0.LTS"
gradle = "9.9.1"

# Cross-build of the agent DLL for x86_64-pc-windows-msvc on macOS and Linux.
# cargo-xwin fetches the MSVC CRT and SDK; accept Microsoft's licence on its
# first run. LLVM supplies clang, lld and llvm-dlltool, which turns
# vendor/lua/lua.def into the import library for lua.dll. A rustup llvm-tools
# component is not enough. A Windows host uses the Visual Studio Build Tools.
"cargo:cargo-xwin" = { version = "0.23.1", os = ["linux", "macos"] }
"github:llvm/llvm-project" = { version = "23.1.5", version_prefix = "llvmorg-", os = ["linux", "macos"] }

# Fuzzing of the transport's decoders (`mise run fuzz`). cargo-fuzz and Miri
# run on the rustup `nightly` toolchain, which `mise run nightly` installs.
"cargo:cargo-fuzz" = { version = "0.13.2", os = ["linux", "macos"] }

# Host builds pass --no-default-features: it turns off the agent's dcs-lua
# feature, which links DCS's lua.dll. A machine without DCS has none.

[tasks.setup]
description = "Point git at the repository's hooks, which run the secret scanner"
run = "git config core.hooksPath .githooks"

[tasks.build]
description = "Build every crate for the host"
run = "cargo build --workspace --all-targets --no-default-features"

[tasks.test]
description = "Run the workspace tests on the host"
run = "cargo test --workspace --no-default-features"

[tasks.tmpleak]
description = "Run the workspace tests and fail if they leave a temp folder or a process"
run = "sh tools/tmpleak.sh"

[tasks.fmt]
description = "Format every crate"
run = "cargo fmt --all"

[tasks.lua]
description = "Open the host-native agent with a stock Lua 5.1"
run = "sh tools/luatest.sh"

# cargo-xwin fetches the MSVC CRT and SDK. A Windows host has them in the
# Visual Studio Build Tools, so plain cargo builds the same target there.
[tasks.windows]
description = "Cross-build the agent DLL, linking DCS's Lua"
# tools/remap.sh keeps the build machine's paths out of the DLL and its PDB.
run = "cargo xwin build --release -p nanoprobe-agent --target x86_64-pc-windows-msvc --config \"$(sh tools/remap.sh x86_64-pc-windows-msvc)\""
run_windows = "cargo build --release -p nanoprobe-agent --target x86_64-pc-windows-msvc"

[tasks.dll]
description = "Check the cross-built DLL's imports, exports and ABI marker, and that no entry point owns a value"
depends = ["windows"]
run = [
  "sh tools/checkdll.sh",
  "sh tools/raiseshape.sh",
  "FEATURES=faults sh tools/raiseshape.sh",
  # checkdll.sh must refuse the faults build that raiseshape.sh just made.
  "sh tools/checkdll.sh target/faults/x86_64-pc-windows-msvc/release/nanoprobe.dll 2>&1 | grep -q 'has fault injection'",
]

[tasks.nightly]
description = "Install the nightly toolchain with Miri, for the miri and fuzz tasks"
run = "rustup toolchain install nightly --profile minimal --component miri,rust-src"

[tasks.miri]
description = "Run the transport's memory, ring, status and codec tests under Miri"
run = "cargo +nightly miri test -p nanoprobe-transport --lib -- ring:: mem:: status:: codec:: records:: handshake:: golden:: layout::"

[tasks.loom]
description = "Model-check the rings and the sequence lock with Loom"
env = { RUSTFLAGS = "--cfg loom" }
run = "cargo test -p nanoprobe-transport --release --test loom"

[tasks.virtual]
description = "The host virtualization exit test at full size (2,000 of 10,000), in release"
run = "cargo test -p nanoprobe-sim-fake --release --test virtualization -- --ignored"

[tasks.fuzz]
description = "Fuzz each transport decoder for FUZZ_SECONDS (default 60)"
dir = "crates/transport/fuzz"
# cargo-fuzz runs cargo again inside; the variable makes both use nightly.
env = { RUSTUP_TOOLCHAIN = "nightly" }
run = """
for t in lv ring records handshake header; do
  cargo fuzz run "$t" -- -max_total_time="${FUZZ_SECONDS:-60}" || exit 1
done
"""

[tasks.peerkill]
description = "The S6 exit test: 1,000 kill-the-peer cycles between the fake agent and the stub sidecar"
run = "cargo xtask peerkill"

[tasks.spec]
description = "Write spec/transport.golden from the tables in the transport specification"
run = "cargo xtask spec"

[tasks.proto]
description = "Lint the public API schema, check it for breaking changes at its merge base with origin/main (else main, else HEAD), test that choice, and check the generated Rust code is current"
run = ["buf lint", "sh tools/protobreak.sh", "sh tools/protobreak-test.sh", "cargo xtask proto --check"]

[tasks.hello]
description = "Run the Rust hello campaign against the API server over the fake sim"
run = "cargo xtask hello"

[tasks.hello-python-gen]
description = "Generate the Python hello campaign's gRPC code from proto/ into examples/hello-python/gen"
run = "sh examples/hello-python/generate.sh"

[tasks.hello-python]
description = "Run the Python hello campaign: mise run hello-python -- http://127.0.0.1:47311"
depends = ["hello-python-gen"]
run = "uv run --frozen --project examples/hello-python python examples/hello-python/hello.py"

[tasks.hello-check]
description = "Run the Python hello campaign against the fake sidecar on a free loopback port"
run = "sh examples/hello-python/check.sh"

[tasks.hello-kotlin]
description = "Run the Kotlin hello campaign: mise run hello-kotlin -- http://127.0.0.1:47311"
dir = "{{config_root}}/examples/hello-kotlin"
run = "gradle --no-daemon --quiet installDist && build/install/hello-kotlin/bin/hello-kotlin"

[tasks.hello-kotlin-check]
description = "Run the Kotlin hello campaign against the fake sidecar on a free loopback port"
run = "sh examples/hello-kotlin/check.sh"

[tasks.package]
description = "Stage the Windows and Linux release archives in dist/ and check them"
depends = ["dll"]
run = ["sh tools/stage-release.sh", "sh tools/stage-release-test.sh"]

[tasks.secrets]
description = "Check that the pre-commit hook blocks a planted secret"
run = "sh tools/secretscan-test.sh"

[tasks.windows-check]
description = "Check every crate for x86_64-pc-windows-msvc with clippy, one crate at a time"
run = "sh tools/windowscheck.sh"

[tasks.check]
description = "What CI checks on the host, and each crate checked for Windows"
depends = ["windows-check"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --no-default-features -- -D warnings",
  # The agent's fault injection (spec/faults.md), which no other build enables.
  "cargo clippy -p nanoprobe-agent --all-targets --no-default-features --features faults -- -D warnings",
  "sh tools/tmpleak-test.sh",
  "sh tools/tmpleak.sh",
  "cargo test -p nanoprobe-sim-fake --release --test virtualization -- --ignored",
  # The Python hello against the fake sidecar. Its first run fetches the
  # pinned wheels with uv; it goes before luatest.sh, whose sidecar test
  # runs the Python hello in that environment.
  "sh examples/hello-python/check.sh",
  # The Kotlin hello against the fake sidecar. Its first build fetches the
  # pinned plugins and libraries with Gradle.
  "sh examples/hello-kotlin/check.sh",
  "sh tools/luatest.sh",
  "buf lint",
  "sh tools/protobreak.sh",
  "sh tools/protobreak-test.sh",
  "cargo xtask proto --check",
  "sh tools/stage-schema-test.sh",
  "sh tools/secretscan-test.sh",
  # The tag and notes checks .github/workflows/release.yml runs before it builds a tag.
  "sh tools/release-check-test.sh",
  "actionlint",
]

[tasks.sidecar-linux]
description = "Build the sidecar as a static Linux program, for its container (deploy/)"
env = { CC_x86_64_unknown_linux_musl = "{{config_root}}/tools/zigcc-musl.sh", AR_x86_64_unknown_linux_musl = "{{config_root}}/tools/zigar.sh" }
run = "cargo build --release --target x86_64-unknown-linux-musl -p nanoprobe-api --bin nanoprobe-sidecar --target-dir target/linux"
