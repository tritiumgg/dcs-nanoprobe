[package]
name = "nanoprobe-cli"
description = "The nanoprobe command: inspect the transport file and watch it live with top."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "nanoprobe"
path = "src/main.rs"

[dependencies]
nanoprobe-proto = { path = "../proto" }
nanoprobe-transport = { path = "../transport" }
tokio = { version = "1.54.1", features = ["rt"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "transport"] }
