[package]
name = "nanoprobe-cli"
description = "The nanoprobe command: install, check and inspect nanoprobe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "nanoprobe"
path = "src/main.rs"

[dependencies]
nanoprobe-agent-link = { path = "../agent-link" }
nanoprobe-install = { path = "../install" }
nanoprobe-proto = { path = "../proto" }
nanoprobe-transport = { path = "../transport" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "transport"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
