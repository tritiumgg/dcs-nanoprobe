# The agent: the DLL DCS loads, and the .so or .dylib the host tests load.
#
# cdylib and no rlib. A host-native module leaves its Lua symbols undefined and
# resolves them from the interpreter that opens it, which a shared object
# permits and an executable does not.
#
# The dcs-lua feature picks where the Lua symbols come from: DCS's lua.dll
# through vendor/lua/lua.def (on, the default), or the interpreter that opens
# the module (off, the host-native build).

[package]
name = "nanoprobe-agent"
description = "The agent: the DLL loaded inside DCS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "nanoprobe"
crate-type = ["cdylib"]

# On by default, because the product is the Windows DLL, and a build that
# quietly omits the Lua binding is the failure to rule out. Host builds pass
# --no-default-features.
[features]
default = ["dcs-lua"]
dcs-lua = []

[lints]
workspace = true

[dependencies]
nanoprobe-transport = { path = "../transport" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
