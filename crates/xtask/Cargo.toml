# Development and test tooling: `cargo xtask <command>`.
#
# It is built from source in this repository and never released. Every target
# it acts on is described in a profile outside the repository.

[package]
name = "xtask"
description = "Development and test tooling for nanoprobe. Not released."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
nanoprobe-agent-link = { path = "../agent-link" }
nanoprobe-fake-agent = { path = "../fake-agent" }
nanoprobe-api = { path = "../api" }
nanoprobe-install = { path = "../install" }
nanoprobe-proto = { path = "../proto" }
nanoprobe-sidecar = { path = "../sidecar", features = ["disk"] }
nanoprobe-transport = { path = "../transport" }
getrandom = "0.3"
hmac = "0.12"
prost = "0.14.6"
prost-types = "0.14.6"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
toml = "1.2.1"
tokio = { version = "1.54.1", features = ["rt", "time"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "transport"] }
tonic-prost-build = "0.14.9"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
