# Development and test tooling: `cargo xtask <command>`.
#
# It is built from source in this repository and never released. Every target
# it acts on is described in a profile outside the repository.

[package]
name = "xtask"
description = "Development and test tooling for nanoprobe. Not released."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
nanoprobe-fake-agent = { path = "../fake-agent" }
nanoprobe-transport = { path = "../transport" }
getrandom = "0.3"
hmac = "0.12"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
