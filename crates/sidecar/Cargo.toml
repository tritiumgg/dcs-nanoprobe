[package]
name = "nanoprobe-sidecar"
description = "The sidecar: world store, reconciler, persistence and API server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# `disk` is the store on disk and the campaign registry, over SQLite. Its C
# build needs a C compiler for the target. The test peers that run in a Linux
# game container (crates/fake-agent) use the store in memory only and turn it
# off, so they cross-build for musl without a C toolchain. Every crate that
# needs the store on disk names the feature.
[features]
default = ["disk"]
disk = ["dep:rusqlite", "dep:zip"]

[dependencies]
nanoprobe-transport = { path = "../transport" }
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
getrandom = "0.3"
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
nanoprobe-sim-fake = { path = "../sim-fake" }
proptest = "1"
tempfile = "3.27.0"
