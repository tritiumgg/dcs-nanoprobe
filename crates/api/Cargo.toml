[package]
name = "nanoprobe-api"
description = "The sidecar's public API server: gRPC services, leases, tokens and subscriptions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
nanoprobe-proto = { path = "../proto" }
nanoprobe-sidecar = { path = "../sidecar", features = ["disk"] }
nanoprobe-transport = { path = "../transport" }
getrandom = "0.3"
prost = "0.14.6"
prost-types = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1.2.1"
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "router", "server", "transport"] }
tonic-reflection = "0.14.9"

[dev-dependencies]
nanoprobe-sim-fake = { path = "../sim-fake" }
proptest = "1"
tempfile = "3.27.0"
