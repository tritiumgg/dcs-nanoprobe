# Test tooling: a fake agent with misbehaviors, a stub sidecar that journals
# what it reads, and a verifier for the journals. Built from source to run;
# never released.

[package]
name = "nanoprobe-fake-agent"
description = "A pure-Rust agent peer with misbehaviors, a journalling stub sidecar, and a journal verifier. Not released."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
nanoprobe-agent-link = { path = "../agent-link", features = ["faults"] }
# Without `disk`: no SQLite, so link-probe cross-builds for musl with no C
# toolchain for the target.
nanoprobe-sidecar = { path = "../sidecar", default-features = false }
nanoprobe-transport = { path = "../transport" }
serde_json = "1.0.154"

[[bin]]
name = "fake-agent"
path = "src/bin/fake-agent.rs"

[[bin]]
name = "stub-sidecar"
path = "src/bin/stub-sidecar.rs"

[[bin]]
name = "link-probe"
path = "src/bin/link-probe.rs"

[[bin]]
name = "chaos-runner"
path = "src/bin/chaos-runner.rs"

[[bin]]
name = "command-script"
path = "src/bin/command-script.rs"
