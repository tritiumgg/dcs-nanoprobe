# Build, lint and host tests on Linux and Windows, and the agent DLL
# cross-built on Linux and built natively on Windows. The Windows build checks
# that the code builds and passes its checks there; no file it makes is
# released. The release's files are built on a Linux runner by release.yml.
# macOS is the development system and runs the same check there; CI does not
# repeat it.
#
# On Linux, CI runs `mise run check` itself, so the two cannot list different
# checks. Every tool comes from mise.toml through mise-action, so CI runs the
# versions a developer runs. Actions are pinned to commit SHAs; the comment
# names the tag.

name: CI

# A change to the documents alone runs nothing. The release notes are the
# exception: the check reads them (tools/release-check-test.sh).
on:
  push:
    branches: [main]
    paths: &code
      - "**"
      - "!docs/**"
      - "docs/release-notes.md"
  pull_request:
    paths: *code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The mise that runs the tasks, the one the developers' check passes with.
  MISE_VERSION: 2026.8.2

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
    env:
      # tools/protobreak.sh compares the schema at its merge base with this
      # commit: the base of a pull request, or the commit before a push. Empty
      # on a manual run, where the script picks origin/main.
      PROTOBREAK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # The cargo-xwin cache path. The home folder is known only on the
      # runner.
      - name: Name the cargo-xwin cache
        run: printf 'XWIN_CACHE_DIR=%s/.cache/cargo-xwin-ci\n' "$HOME" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads the whole history, and the breaking-change
          # check needs the base commit.
          fetch-depth: 0
          persist-credentials: false

      # The mise tools (LLVM alone unpacks to about 8 GB) and the builds do
      # not fit beside the toolchains the Linux image ships. This job takes
      # every tool from mise, so it removes those toolchains and the image's
      # tool cache.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      # The mise Lua 5.1 build links readline. The packages are the ones of
      # the image's Ubuntu release.
      - name: Install the headers the Lua build needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreadline-dev libncurses-dev

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read main's cache and write none.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-xwin downloads the MSVC CRT and Windows SDK once per cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin-ci
          key: xwin-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: The developers' check (mise run check)
        run: mise run check

      - name: The agent DLL, its imports and exports, and that no entry point owns a value (mise run dll)
        run: mise run dll

      - name: Secret scan of the history
        if: runner.os == 'Linux'
        run: gitleaks git --redact --no-banner .

  # The Rust builds and tests of `mise run check`, and the DLL's checks. The
  # rest of the check task runs on Linux only: tools/tmpleak.sh needs
  # pgrep, the host Lua 5.1 is built with make, the hello campaigns' scripts
  # manage processes with pkill, and the schema, secret-hook, release-script
  # and workflow lints check files that are the same on every system.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # build.rs makes the lua.dll import library with llvm-dlltool or llvm-lib,
      # from the LLVM the runner image ships.
      - name: Put LLVM on PATH
        shell: bash
        run: printf '%s\n' 'C:\Program Files\LLVM\bin' >>"$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Clippy on the agent with fault injection
        run: cargo clippy -p nanoprobe-agent --all-targets --no-default-features --features faults -- -D warnings

      # tools/tmpleak.sh needs pgrep, which Windows lacks; the tests run
      # plainly. Every crate's tests run, so one run shows every failure.
      - name: Test
        run: cargo test --workspace --no-default-features --no-fail-fast

      - name: Virtualization at full size, in release
        run: cargo test -p nanoprobe-sim-fake --release --test virtualization -- --ignored

      - name: Check the generated API code is current
        run: cargo xtask proto --check

      - name: Check each crate for Windows
        shell: bash
        run: sh tools/windowscheck.sh

      - name: Build the agent DLL
        run: cargo build --release -p nanoprobe-agent --target x86_64-pc-windows-msvc

      - name: Check the DLL
        shell: bash
        run: sh tools/checkdll.sh

      - name: Check that no entry point owns a value
        shell: bash
        run: sh tools/raiseshape.sh

      - name: Check that no entry point owns a value, with fault injection
        shell: bash
        run: FEATURES=faults sh tools/raiseshape.sh

      - name: Check that the DLL check refuses the fault-injection build
        shell: bash
        # GitHub runs bash with pipefail, and checkdll.sh exits 1 on this
        # DLL, so its output is captured before it is matched.
        run: |
          if out=$(sh tools/checkdll.sh target/faults/x86_64-pc-windows-msvc/release/nanoprobe.dll 2>&1); then
            printf 'checkdll.sh accepted the fault-injection build\n' >&2
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'has fault injection'
